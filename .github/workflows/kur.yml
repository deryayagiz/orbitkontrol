name: TCMB kurlarını güncelle

on:
  schedule:
    - cron: "50 12 * * 1-5"   # hafta içi 15:50 (İstanbul) — TCMB 15:30'da açıklar
  workflow_dispatch:           # Actions sekmesinden elle de çalıştırılabilir

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/kur_guncelle.py
      - name: Değiştiyse kaydet
        run: |
          git config user.name "kur-bot"
          git config user.email "kur-bot@users.noreply.github.com"
          git add kur.json
          git diff --cached --quiet || (git commit -m "Kurlar güncellendi" && git push)
