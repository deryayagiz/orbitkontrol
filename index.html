h1,h2,h3,h4{font-weight:500;letter-spacing:-.02em}
/* header */

.nd>span{position:absolute;white-space:nowrap;transform:translate(-50%,-50%) rotate(calc(-1*var(--a)));animation:cr 80s linear infinite;background:rgba(10,30,54,.85);border:1px solid #44d1c4;border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:700;color:#fff;backdrop-filter:blur(4px)}

</style></head><body><div id="app"></div><script>window.MODE="hash";window.TX={"de": {"What We Do": "Was wir tun", "How We Work": "Wie wir arbeiten", "Services": "Leistungen", "Office Tasks": "Bürodienste", "Our Experts": "Unsere Experten", "Contact": "Kontakt", "Free Check-up": "Kostenloser Check-up", "BUSINESS CONTROL & SYSTEM DESIGN": "UNTERNEHMENSKONTROLLE & SYSTEMDESIGN", "Keep control <em>while your business grows.</em>": "Behalten Sie die Kontrolle, <em>während Ihr Unternehmen wächst.</em>", "Where is your money, do your systems understand each other, do you know your risks and are you ready? Together with our specialists we look at it all as one: we see, build and monitor.": "Wo ist Ihr Geld, verstehen sich Ihre Systeme, kennen Sie Ihre Risiken und sind Sie vorbereitet? Gemeinsam mit unseren Fachleuten betrachten wir alles als Ganzes: Wir sehen, bauen auf und überwachen.", "What do we do?": "Was wir tun", "OUR AREAS": "UNSERE BEREICHE", "Your business’s sustainability depends on all of its systems working together in harmony and working correctly.": "Die Nachhaltigkeit Ihres Unternehmens hängt davon ab, dass alle Systeme im Einklang und richtig zusammenarbeiten.", "A business doesn’t break in just one place. Every step is valuable. If we can’t take hold of money and can’t control it, it can end everything. If process and authority are undefined, leakage follows. If software and data don’t carry the work, efficiency drops. If legal, human and ethical risks stay hidden, trust erodes or damage that is impossible to recover from can occur. If there’s no readiness for disaster, outage or supply risk, work stops. The management layer makes all of it regularly visible.": "Ein Unternehmen bricht nicht nur an einer Stelle. Jeder Schritt zählt. Wenn wir das Geld nicht im Griff haben und nicht kontrollieren, kann das alles beenden. Sind Prozesse und Befugnisse nicht definiert, entstehen Lecks. Tragen Software und Daten die Arbeit nicht, sinkt die Effizienz. Bleiben rechtliche, menschliche und ethische Risiken verborgen, schwindet das Vertrauen oder es entstehen Schäden, die nicht mehr aufzufangen sind. Ohne Vorbereitung auf Katastrophen, Ausfälle und Lieferrisiken steht der Betrieb still. Die Managementebene macht all das regelmäßig sichtbar.", "Money": "Finanzen", "Am I on top of my money? Where is it, and where does it go? Am I doing what it takes to keep it from being stolen?": "Habe ich mein Geld im Griff? Wo ist es und wohin fließt es? Tue ich genug, um es vor Diebstahl zu schützen?", "See the details": "Details ansehen", "Systems": "Systeme", "Are my purchasing, sales, stock, logistics and authority definitions under control?": "Sind Einkauf, Verkauf, Lager, Logistik und Befugnisse bei mir unter Kontrolle?", "IT": "IT", "Does my software carry my business? Do my systems talk to each other, and is my data safe?": "Trägt meine Software mein Geschäft? Sprechen meine Systeme miteinander und sind meine Daten sicher?", "Trust": "Vertrauen", "Who and what am I dependent on? Are contract, leak, conflict-of-interest and compliance risks visible?": "Von wem und wovon bin ich abhängig? Sind Vertrags-, Leck-, Interessenkonflikt- und Compliance-Risiken sichtbar?", "Physical Risks": "Physische Risiken", "If fire, earthquake, flood or an outage hits, does the business stop? Does my insurance really cover the risk?": "Steht der Betrieb still, wenn Feuer, Erdbeben, Flut oder ein Ausfall eintritt? Deckt meine Versicherung das Risiko wirklich?", "Management": "Management", "Where does my company stand today? Is the system we built still working? Am I ready to grow, hand over or merge?": "Wo steht mein Unternehmen heute? Funktioniert das aufgebaute System noch? Bin ich bereit zu wachsen, zu übergeben oder zu fusionieren?", "OUR METHOD": "UNSERE METHODE", "From assessment to verification.": "Von der Analyse bis zur Bestätigung.", "We work with one four-step method: we see the situation, advise, build the system and verify that it works.": "Wir arbeiten mit einer einzigen Methode in vier Schritten: Wir erfassen die Lage, beraten, bauen das System auf und prüfen, dass es funktioniert.", "How we work": "Wie wir arbeiten", "Assess": "Analyse", "Where does my company stand today?": "Wo steht mein Unternehmen heute?", "We understand the current situation through data, documents, interviews, processes and systems.": "Wir verstehen die aktuelle Lage anhand von Daten, Dokumenten, Gesprächen, Prozessen und Systemen.", "Advise": "Beratung", "What are the solution options?": "Welche Lösungen gibt es?", "We prioritise the findings and build a 3, 6 and 12-month roadmap.": "Wir priorisieren die Ergebnisse und erstellen einen Fahrplan für 3, 6 und 12 Monate.", "Build": "Aufbau", "The system is designed and in place.": "Das System ist entworfen und eingerichtet.", "We design and set up processes, authority, reporting, systems and continuity plans.": "Wir entwerfen und richten Prozesse, Befugnisse, Berichtswesen, Systeme und Kontinuitätspläne ein.", "Verify & monitor": "Bestätigung & Überwachung", "The system really works.": "Das System funktioniert wirklich.", "Where appropriate we verify at days 30 and 90, then monitor regularly.": "Wo sinnvoll, prüfen wir nach 30 und 90 Tagen und überwachen danach regelmäßig.", "FOR SMALL BUSINESSES": "FÜR KLEINE UNTERNEHMEN", "Daily Office Tasks": "Tägliche Bürodienste", "Hand over the matters you don’t want to lose time on and focus on your business. In one-person or 3–5 person businesses, you can buy packaged services for the work you have no department or specialist for.": "Übergeben Sie uns die Aufgaben, mit denen Sie keine Zeit verlieren möchten, und konzentrieren Sie sich auf Ihr Geschäft. In Ein-Personen- oder 3–5-Personen-Betrieben können Sie paketierte Leistungen für Arbeiten kaufen, für die Ihnen eine Abteilung oder ein Fachmann fehlt.", "Sales & Quotes": "Vertrieb & Angebote", "Are my quotes, price list, presentations and supplier market research in order?": "Sind meine Angebote, Preisliste, Präsentationen und Lieferantenrecherche in Ordnung?", "services": "Leistungen", "Receivables & Accounts": "Forderungen & Konten", "Are my receivables and accounts being followed up?": "Werden meine Forderungen und Kundenkonten verfolgt?", "Credit & Finance Preparation": "Kredit- & Finanzierungsvorbereitung", "Is the file I’m submitting to the bank ready?": "Ist die Unterlage für die Bank bereit?", "Documents & Bookkeeping Prep": "Belege & Buchhaltungsvorbereitung", "Are my documents ready for my accountant?": "Sind meine Belege bereit für den Steuerberater?", "Field & Reporting": "Vor Ort & Berichtswesen", "Are my stock count and monthly report ready on time?": "Sind Inventur und Monatsbericht rechtzeitig fertig?", "Personnel & Official Matters": "Personal & Behördliches", "Are my personnel-related official letters and permits handled on time?": "Werden behördliche Schreiben und Genehmigungen zu meinem Personal rechtzeitig erledigt?", "Association Matters": "Vereinsangelegenheiten", "Is my association set up properly, with its administration in order?": "Ist mein Verein richtig gegründet und seine Verwaltung geordnet?", "All Office Tasks": "Alle Bürodienste", "See prices, pick a quantity and request right away.": "Preise ansehen, Menge wählen und sofort anfragen.", "Browse": "Ansehen", "OUR TEAM": "UNSER TEAM", "Our team has two rings. We design the system and run the control work; our solution partners step in for specialist and regulated work.": "Unser Team besteht aus zwei Kreisen. Wir entwerfen das System und führen die Kontrollarbeit durch; unsere Lösungspartner übernehmen Fach- und regulierte Aufgaben.", "Our Expert Team": "Unser Expertenteam", "They design the system and run the control work. Every project has a lead and a second reviewer, so you rely on two sets of eyes, not one person’s opinion.": "Sie entwerfen das System und führen die Kontrollarbeit durch. Jedes Projekt hat eine verantwortliche Person und einen zweiten Prüfer – Sie verlassen sich auf zwei Augenpaare, nicht auf die Meinung einer Person.", "Systems design": "Systemdesign", "Internal & financial control": "Interne & finanzielle Kontrolle", "Software & ERP": "Software & ERP", "Cybersecurity": "Cybersicherheit", "Business continuity": "Betriebskontinuität", "Association setup": "Vereinsgründung", "Our solution partners": "Unsere Lösungspartner", "Solution partners whose professional advice we draw on where their expertise is needed; they carry out regulated and licensed work under their own contracts and responsibility.": "Lösungspartner, deren fachlichen Rat wir dort einholen, wo ihre Expertise gebraucht wird; sie übernehmen regulierte und zulassungspflichtige Arbeiten mit eigenen Verträgen und eigener Verantwortung.", "Lawyer": "Rechtsanwalt", "CPA / Sworn CPA": "Steuerberater / vereidigter Prüfer", "Insurance": "Versicherung", "OHS provider": "Arbeitsschutzdienst", "Quality & QESH": "Qualität & QHSE", "Data & IT": "Daten & IT", "Grants & support": "Förderungen & Zuschüsse", "Corporate identity": "Corporate Identity", "Collateral appraisal": "Sicherheitenbewertung", "Meet our experts": "Lernen Sie unsere Experten kennen", "Reach us quickly.": "Erreichen Sie uns schnell.", "Tell us what’s on your mind, and we’ll talk plainly about what we can do, how, and how long it takes.": "Erzählen Sie uns, was Sie beschäftigt – wir sprechen klar darüber, was wir tun können, wie und wie lange es dauert.", "Message on WhatsApp": "Auf WhatsApp schreiben", "Hello, I’d like to talk to Orbit Kontrol.": "Hallo, ich möchte mit Orbit Kontrol sprechen.", "Other: a few words": "Sonstiges: kurz beschreiben", "e.g. textile manufacturing, wholesale…": "z. B. Textilproduktion, Großhandel…", "Full name": "Vor- und Nachname", "Company": "Unternehmen", "Phone": "Telefon", "Email (optional)": "E-Mail (optional)", "Anything to add (optional)": "Weitere Hinweise (optional)", "Complete Service List": "Vollständige Leistungsliste", "About us": "Über uns", "Privacy & KVKK": "Datenschutz & KVKK", " – Keep control while your company grows": " – Behalten Sie die Kontrolle, während Ihr Unternehmen wächst", "We work across complementary core areas so your business keeps standing. You don’t need to know service names; pick the question closest to yours and we’ll go into detail.": "Wir arbeiten in sich ergänzenden Kernbereichen, damit Ihr Unternehmen stabil bleibt. Sie müssen keine Leistungsnamen kennen; wählen Sie die Frage, die Ihrer am nächsten kommt, und wir gehen ins Detail.", "We work out how you can take hold of your money. To remove the losses caused by missing systems and work that is disconnected and not integrated, we connect every job to the others. We make your software talk to each other.": "Wir finden heraus, wie Sie Ihr Geld in den Griff bekommen. Um Verluste durch fehlende Systeme und unverbundene, nicht integrierte Arbeit zu beseitigen, verbinden wir jede Aufgabe mit den anderen. Wir bringen Ihre Software dazu, miteinander zu sprechen.", "We check whether you work in a safe space legally and in terms of insurance. We look together at which measures you can take against disasters and the setbacks that could turn into disasters. So you can make the right management decisions, we let you see your business correctly through reports.": "Wir prüfen, ob Sie rechtlich und versicherungstechnisch auf sicherem Boden arbeiten. Gemeinsam sehen wir, welche Maßnahmen Sie gegen Katastrophen und Rückschläge, die zu Katastrophen werden können, ergreifen können. Damit Sie richtige Managemententscheidungen treffen, zeigen wir Ihnen Ihr Unternehmen anhand von Berichten klar.", "We make visible where the money is, where it goes and how it is protected.": "Wir machen sichtbar, wo das Geld ist, wohin es fließt und wie es geschützt wird.", "Cash, Collections & Accounts": "Liquidität, Inkasso & Konten", "Cheques, Notes & Collateral": "Schecks, Wechsel & Sicherheiten", "Accounting Accuracy & Tax Readiness": "Buchhaltungsgenauigkeit & Steuerbereitschaft", "Profitability, Budget & Financing": "Rentabilität, Budget & Finanzierung", "Expense & Cost Efficiency": "Ausgaben- & Kosteneffizienz", "Grants, Support & Incentives": "Förderungen, Zuschüsse & Anreize", "We make the work run defined and measurable, independent of individuals, and set up the authority and signing structure.": "Wir sorgen dafür, dass die Arbeit definiert, messbar und personenunabhängig läuft, und richten Befugnis- und Zeichnungsstrukturen ein.", "Purchasing & Sales Control": "Einkaufs- & Verkaufskontrolle", "Stock & Inventory": "Lager & Inventar", "Logistics & Shipping": "Logistik & Versand", "Process, Authority & Field Operations": "Prozesse, Befugnisse & Außendienst", "Sector Controls: Food": "Branchenkontrollen: Lebensmittel", "We connect your software, build new where needed and keep your data safe.": "Wir verbinden Ihre Software, entwickeln bei Bedarf Neues und schützen Ihre Daten.", "Software Needs & Existing System Review": "Softwarebedarf & Prüfung bestehender Systeme", "ERP Systems & Integration": "ERP-Systeme & Integration", "Custom Software Development": "Individuelle Softwareentwicklung", "Vehicle Tracking & Field Systems": "Fahrzeugortung & Außendienstsysteme", "Digitalisation & E-Transformation": "Digitalisierung & E-Transformation", "Data, BI & IT Strategy": "Daten, BI & IT-Strategie", "We make legal, human and ethical risks visible: contracts, key people, leaks, conflicts of interest, regulation and certification.": "Wir machen rechtliche, menschliche und ethische Risiken sichtbar: Verträge, Schlüsselpersonen, Lecks, Interessenkonflikte, Regulierung und Zertifizierung.", "Legal Structure & Compliance (with legal partner)": "Rechtsstruktur & Compliance (mit Rechtspartner)", "HR & Key People": "Personal & Schlüsselpersonen", "Ethics & Internal Control": "Ethik & interne Kontrolle", "Regulation, Certification & Climate Compliance": "Regulierung, Zertifizierung & Klima-Compliance", "We keep your business standing against disaster, outage, supply and insurance risks.": "Wir halten Ihr Unternehmen gegen Katastrophen-, Ausfall-, Liefer- und Versicherungsrisiken stabil.", "Physical Risk & Disaster": "Physisches Risiko & Katastrophen", "Outage & Supply Risk": "Ausfall- & Lieferrisiko", "Insurance Adequacy": "Angemessene Versicherung", "The management layer above the other areas that makes everything regularly visible: check-up, dashboard and continuous control.": "Die Managementebene über den anderen Bereichen, die alles regelmäßig sichtbar macht: Check-up, Dashboard und laufende Kontrolle.", "Check-up, Dashboard & Training": "Check-up, Dashboard & Schulung", "Continuous Control": "Laufende Kontrolle", "Growth, Handover & Merger": "Wachstum, Übergabe & Fusion", "Association Setup & Administration": "Vereinsgründung & Verwaltung", "ALL SERVICES": "ALLE LEISTUNGEN", "See all our services with their codes, scope and output on one page; build your own needs list.": "Sehen Sie alle Leistungen mit Codes, Umfang und Ergebnis auf einer Seite und stellen Sie Ihre eigene Bedarfsliste zusammen.", "Buy day-to-day jobs such as quotes, price lists, documents, reconciliations, counts, reports and association matters by quantity, with prices shown upfront.": "Kaufen Sie tägliche Aufgaben wie Angebote, Preislisten, Belege, Abstimmungen, Inventuren, Berichte und Vereinsangelegenheiten nach Menge – mit vorab sichtbaren Preisen.", "What we do, and what we don’t": "Was wir tun – und was nicht", "We guarantee method, evidence and scope, not outcomes.": "Wir garantieren Methode, Nachweis und Umfang, nicht das Ergebnis.", "WE DO": "WIR TUN", "Internal-control review, process and authority design, management reporting system": "Prüfung der internen Kontrolle, Prozess- und Befugnisdesign, Management-Berichtssystem", "Sample testing, phone verification, field and stock-count observation, data analysis": "Stichprobenprüfung, telefonische Bestätigung, Vor-Ort- und Inventurbeobachtung, Datenanalyse", "Cash, receivables, profitability, budget model, recurring-expense review and management dashboard": "Liquidität, Forderungen, Rentabilität, Budgetmodell, Prüfung wiederkehrender Ausgaben und Management-Dashboard", "Stock, logistics and route-efficiency review; planning routine": "Prüfung von Lager-, Logistik- und Routeneffizienz; Planungsroutine", "Software needs analysis, ERP readiness and go-live management, integration, custom software, vehicle tracking": "Softwarebedarfsanalyse, ERP-Vorbereitung und Einführungsmanagement, Integration, Individualsoftware, Fahrzeugortung", "Data architecture, BI, process redesign, IT strategy": "Datenarchitektur, BI, Prozessneugestaltung, IT-Strategie", "Cyber-hygiene scan, backup-restore test, phishing simulation, digital ownership and access management": "Cyber-Hygiene-Scan, Backup-Wiederherstellungstest, Phishing-Simulation, digitales Eigentum und Zugriffsverwaltung", "Business continuity, fire and physical-risk pre-review, drills, emergency plan": "Betriebskontinuität, Vorprüfung von Brand- und physischen Risiken, Übungen, Notfallplan", "Recipe, waste and profitability control in food": "Rezeptur-, Schwund- und Rentabilitätskontrolle in der Gastronomie", "Pre-merger financial position assessment and post-merger integration programme": "Finanzlagebewertung vor einer Fusion und Integrationsprogramm danach", "Readiness consulting: quality, environment, carbon data, supplier assurance file": "Vorbereitungsberatung: Qualität, Umwelt, CO₂-Daten, Lieferantennachweis", "DONE WITH AUTHORISED PARTNERS": "MIT ZUGELASSENEN PARTNERN", "Legal opinions, contract drafting, litigation and enforcement: lawyer partner under their own contract": "Rechtsgutachten, Vertragsentwürfe, Prozesse und Vollstreckung: Rechtsanwaltspartner mit eigenem Vertrag", "Trademark, patent and design filings: trademark and patent attorney / lawyer": "Marken-, Patent- und Designanmeldungen: Marken- und Patentanwalt / Rechtsanwalt", "Tax advice, filings, books, certification, incentive-document approval: CPA / sworn CPA": "Steuerberatung, Erklärungen, Bücher, Testate, Bestätigung von Förderunterlagen: Steuerberater / vereidigter Prüfer", "Insurance coverage advice, premium comparison, policy placement: insurance agent / broker": "Beratung zum Versicherungsschutz, Prämienvergleich, Policenplatzierung: Versicherungsagent / Makler", "Official OHS service and risk assessment: licensed OHS provider": "Offizieller Arbeitsschutzdienst und Gefährdungsbeurteilung: zugelassener Arbeitsschutzdienst", "Structural safety and earthquake risk assessment: licensed body": "Bausicherheit und Erdbebenrisikobewertung: zugelassene Stelle", "Technical sweeps (eavesdropping, tracking devices, malware) and penetration testing: licensed IT and technical-protection partner": "Technische Prüfungen (Abhörgeräte, Ortungsgeräte, Schadsoftware) und Penetrationstests: zugelassener IT- und Technikschutzpartner", "Collateral appraisal: licensed valuation body": "Sicherheitenbewertung: zugelassene Bewertungsstelle", "Emissions verification, certification, official energy audit: accredited body": "Emissionsverifizierung, Zertifizierung, amtliches Energieaudit: akkreditierte Stelle", "Grant and incentive application preparation: grants & support partner; financial side with CPA": "Vorbereitung von Förder- und Anreizanträgen: Partner für Förderungen; Finanzseite mit dem Steuerberater", "WE DON’T": "WIR TUN NICHT", "Issuing an independent audit report or tax certification": "Bestätigungsvermerke oder Steuertestate ausstellen", "Bookkeeping, tax returns, accounting entries": "Buchführung, Steuererklärungen, Buchungen", "Legal opinions, litigation or enforcement": "Rechtsgutachten, Prozesse oder Vollstreckung", "Insurance brokerage": "Versicherungsvermittlung", "Investment advice, credit brokerage or valuation": "Anlageberatung, Kreditvermittlung oder Bewertung", "Protection, armed security or private investigation": "Personenschutz, bewaffnete Sicherheit oder Privatermittlung", "Expert-witness reports or reports serving as legal evidence": "Sachverständigengutachten oder Berichte mit Beweiskraft", "Independent audit, legal or tax due diligence in a merger": "Abschlussprüfung, rechtliche oder steuerliche Due Diligence bei Fusionen", "Guaranteeing outcomes (method, evidence and scope are guaranteed)": "Ergebnisse garantieren (Methode, Nachweis und Umfang werden garantiert)", "From assessment to verification, we evaluate every business with methods personalised to its own needs. Come with your own sentences; we’ll assess them with the right specialist and offer a solution.": "Von der Analyse bis zur Bestätigung bewerten wir jedes Unternehmen mit Methoden, die auf seinen Bedarf zugeschnitten sind. Kommen Sie mit Ihren eigenen Worten; wir bewerten sie mit dem richtigen Fachmann und bieten eine Lösung an.", "Working Model": "Arbeitsmodell", "Review of data, interviews, documents, processes and systems, plus risk and financial analysis.": "Prüfung von Daten, Gesprächen, Dokumenten, Prozessen und Systemen sowie Risiko- und Finanzanalyse.", "Prioritising findings, comparing solution options, a 3–6–12 month roadmap.": "Priorisierung der Ergebnisse, Vergleich von Lösungsoptionen, Fahrplan für 3–6–12 Monate.", "Designing and rolling out processes, authority, the control system, reporting, ERP structure, continuity plan and documentation.": "Entwurf und Einführung von Prozessen, Befugnissen, Kontrollsystem, Berichtswesen, ERP-Struktur, Kontinuitätsplan und Dokumentation.", "30 and 90-day verification; running the work ourselves if needed; periodic control.": "Bestätigung nach 30 und 90 Tagen; bei Bedarf übernehmen wir die Arbeit selbst; regelmäßige Kontrolle.", "Our Service Packages": "Unsere Leistungspakete", "Clients usually start with one sentence. For each sentence we have a ready service package that brings the relevant checks together, with one contract, one lead and one report. You can also buy items one by one.": "Kunden beginnen meist mit einem Satz. Für j  Vertrag.", "Businesses applying for a bank loan that want the tables, calculations and file the bank requires prepared, and those that must document percentage of completion on projects such as construction": "Unternehmen, die einen Bankkredit beantragen und die von der Bank verlangten Tabellen, Berechnungen und Unterlagen vorbereiten lassen möchten, sowie Projekte wie Bauvorhaben, die den Fertigstellungsgrad nachweisen müssen", "3–5 business days with a complete trial balance; completion calculations vary with project data": "3–5 Werktage mit vollständiger Saldenliste; Fertigstellungsberechnungen je nach Projektdaten", "Current trial balance, balance sheet and income statement, the bank’s document list, project budget and cost items (for construction), contracts and progress-payment details": "Aktuelle Saldenliste, Bilanz und GuV, Unterlagenliste der Bank, Projektbudget und Kostenpositionen (für Bau), Verträge und Abschlagszahlungen", "Those who want to bring receipts and invoices to their accountant in an orderly, trackable way": "Wer Quittungen und Rechnungen geordnet und nachvollziehbar an den Steuerberater geben möchte", "Up to 100 documents: 2 business days, then in steps": "Bis 100 Belege: 2 Werktage, danach gestaffelt", "Legible document photos, serial-number range, your accountant’s Excel layout preference": "Lesbare Belegfotos, Nummernbereich, gewünschtes Excel-Layout Ihres Steuerberaters", "Those struggling to match bank statements to accounts": "Wer Kontoauszüge nur schwer mit den Konten abgleichen kann", "Up to 1,000 transactions: 2 business days": "Bis 1.000 Bewegungen: 2 Werktage", "Bank statement (Excel or PDF), account list": "Kontoauszug (Excel oder PDF), Kontenliste", "Those with a messy archive who want documents in order": "Wer ein ungeordnetes Archiv hat und Ordnung in seine Unterlagen bringen möchte", "Up to 100 files: 3 business days, then in steps": "Bis 100 Akten: 3 Werktage, danach gestaffelt", "Document bundle or photos": "Unterlagenpake ne scans, backup-restore tests, phishing simulations, technical-protection coordination, digital ownership and access management.": "Master an der METU; Spezialist für Cyberkriminalität und IT-Straftaten. Leitet Cyber-Hygiene-Scans, Wiederherstellungstests, Phishing-Simulationen, Koordination technischer Schutzprüfungen sowie digitales Eigentum und Zugriffsverwaltung.", "Partners whose professional advice we draw on where their expertise is needed. They carry out regulated or licensed work under their own contracts and responsibility.": "Partner, deren fachlichen Rat wir dort einholen, wo ihre Expertise gebraucht wird. Sie übernehmen regulierte oder zulassungspflichtige Arbeiten mit eigenen Verträgen und eigener Verantwortung.", "Legal opinions, contract and text drafting, KVKK texts, post-incident legal process; trademark and patent attorneys for IP.": "Rechtsgutachten, Vertrags- und Textentwürfe, KVKK-Texte, rechtliches Vorgehen nach Vorfällen; Marken- und Patentanwälte für geistiges Eigentum.", "Tax advice, filings, books, certification, transfer pricing, incentive-document approval.": "Steuerberatung, Erklärungen, Bücher, Testate, Verrechnungspreise, Bestätigung von Förderunterlagen.", "Insurance Agent / Broker": "Versicherungsagent / Makler", "Coverage advice, quote gathering, policy placement, claims process.": "Beratung zum Versicherungsschutz, Angebotseinholung, Policenplatzierung, Schadensabwicklung.", "OHS Provider": "Arbeitsschutzdienst", "Official OHS service, signed risk assessment, workplace physician, training.": "Offizieller Arbeitsschutzdienst, unterzeichnete Gefährdungsbeurteilung, Betriebsarzt, Schulungen.", "Quality Systems & QESH": "Qualitätssysteme & QHSE", "OHS system checks, ISO certification readiness, environment and carbon data, procedure documentation.": "Prüfung von Arbeitsschutzsystemen, Vorbereitung auf ISO-Zertifizierung, Umwelt- und CO₂-Daten, Verfahrensdokumentation.", "IT Partner": "IT-Partner", "Extra capacity for development, integration and infrastructure.": "Zusätzliche Kapazität für Entwicklung, Integration und Infrastruktur.", "Data architecture and governance, BI and analytics, process redesign, IT strategy and team design, data-protection officer (DPO) support.": "Datenarchitektur und Governance, BI und Analytics, Prozessneugestaltung, IT-Strategie und Teamaufbau, Unterstützung als Datenschutzbeauftragter (DSB).", "Licensed Cybersecurity": "Zugelassene Cybersicherheit", "Vulnerability scans, penetration tests, technical execution of restore tests.": "Schwachstellenscans, Penetrationstests, technische Durchführung von Wiederherstellungstests.", "Technical Protection (licensed)": "Technischer Schutz (zugelassen)", "Eavesdropping, tracking-device and malware sweeps.": "Prüfung auf Abhörgeräte, Ortungsgeräte und Schadsoftware.", "Grants & Support": "Förderungen & Zuschüsse", "Screening grant, support and incentive programmes, preparing the application file and following the process.": "Prüfung von Förder-, Zuschuss- und Anreizprogrammen, Vorbereitung der Antragsunterlagen und Begleitung des Verfahrens.", "Corporate Identity Design": "Corporate-Identity-Design", "Logo, colour and type system, letterhead, business cards, presentation and document templates; brand guidelines.": "Logo, Farb- und Schriftsystem, Briefpapier, Visitenkarten, Präsentations- und Dokumentvorlagen; Markenrichtlinien.", "Property & Land Collateral Appraisal": "Bewertung von Immobilien- & Grundstückssicherheiten", "Appraisal of property and land collateral by licensed valuers; current value report.": "Bewertung von Immobilien- und Grundstückssicherheiten durch zugelassene Gutachter; aktueller Wertbericht.", "Food: Recipe, Waste & Cost": "Lebensmittel: Rezeptur, Schwund & Kosten", "Food recipe, waste and profitability control; standardisation for food businesses heading toward chains.": "Rezeptur-, Schwund- und Rentabilitätskontrolle; Standardisierung für Gastronomiebetriebe auf dem Weg zur Kette.", "Accredited & Licensed Bodies": "Akkreditierte & zugelassene Stellen", "Emissions verification, ISO certification, measurement, official energy audits.": "Emissionsverifizierung, ISO-Zertifizierung, Messungen, amtliche Energieaudits.", "Other": "Sonstiges", "Project-based work on varied topics such as engineering-heavy special subjects and Human Resources.": "Projektbezogene Arbeit zu verschiedenen Themen wie ingenieurlastigen Sonderfragen und Personalwesen.", "Our working principles": "Unsere Arbeitsprinzipien", "Every project has one lead (project manager) and one second reviewer.": "Jedes Projekt hat eine verantwortliche Person (Projektleitung) und einen zweiten Prüfer.", "On topics that need specialist knowledge, a team works under the specialist’s supervision.": "Bei Themen, die Fachwissen erfordern, arbeitet ein Team unter Aufsicht des Fachmanns.", "Each expert works in their own field: a software lead on software jobs, a cybersecurity lead on cybersecurity jobs.": "Jeder Experte arbeitet in seinem Fachgebiet: Software-Verantwortliche bei Softwareprojekten, Cybersicherheits-Verantwortliche bei Cybersicherheitsprojekten.", "Partners declare any conflict of interest; experts give no opinions outside their remit and refer to a partner.": "Partner legen Interessenkonflikte offen; Experten äußern sich nicht außerhalb ihres Fachgebiets und verweisen an einen Partner.", "Reach us quickly on WhatsApp, Telegram or WeChat.": "Erreichen Sie uns schnell über WhatsApp, Telegram oder WeChat.", "On WeChat you can find us with the number 0 532 598 97 04.": "Auf WeChat finden Sie uns unter der Nummer 0 532 598 97 04.", "Email": "E-Mail", "Address": "Adresse", "Hello, I’d like some information.": "Hallo, ich hätte gern Informationen.", "Not cold reports, but solutions that touch your work right away. We’re an approachable team that stands beside growing businesses so they keep control as they grow.": "Keine kalten Berichte, sondern Lösungen, die Ihre Arbeit sofort berühren. Wir sind ein nahbares Team, das wachsenden Unternehmen zur Seite steht, damit sie beim Wachsen die Kontrolle behalten.", "Who are we?": "Wer sind wir?", "Orbit Kontrol is a team that treats the money, operations, IT, trust and physical risks of growing SMEs and family companies as one business system: it designs the system, sets it up and monitors that it works. System design sits at the centre, with specialists from different disciplines around it.": "Orbit Kontrol ist ein Team, das Geld, Betrieb, IT, Vertrauen und physische Risiken wachsender KMU und Familienunternehmen als ein Unternehmenssystem betrachtet: Es entwirft das System, richtet es ein und überwacht, dass es funktioniert. Im Zentrum steht Systemdesign, umgeben von Fachleuten verschiedener Disziplinen.", "Our starting point: sustainability": "Unser Ausgangspunkt: Nachhaltigkeit", "A business doesn’t break in just one place. If money isn’t visible, decisions slip; if process and authority are undefined, leakage follows; if software and data don’t carry the work, efficiency drops; if legal, human and ethical risks stay hidden, trust erodes; if there’s no readiness for disaster, outage or supply risk, work stops. The management layer makes all of it regularly visible. That’s why we organise our services into complementary core areas.": "Ein Unternehmen bricht nicht nur an einer Stelle. Ist das Geld nicht sichtbar, verzögern sich Entscheidungen; sind Prozesse und Befugnisse nicht definiert, entstehen Lecks; tragen Software und Daten die Arbeit nicht, sinkt die Effizienz; bleiben rechtliche, menschliche und ethische Risiken verborgen, schwindet das Vertrauen; ohne Vorbereitung auf Katastrophen, Ausfälle oder Lieferrisiken steht der Betrieb still. Die Managementebene macht all das regelmäßig sichtbar. Deshalb gliedern wir unsere Leistungen in sich ergänzende Kernbereiche.", "Three things that define us": "Drei Dinge, die uns ausmachen", "We’re close": "Wir sind nah", "Write on WhatsApp or call. Without long meetings first, we start with whatever you need.": "Schreiben Sie auf WhatsApp oder rufen Sie an. Ohne lange Vorab-Meetings beginnen wir mit dem, was Sie brauchen.", "We keep it simple": "Wir halten es einfach", "You don’t need to know service names; start in your own words. We connect that sentence to the right area and the right specialist.": "Sie müssen keine Leistungsnamen kennen; beginnen Sie mit eigenen Worten. Wir verbinden diesen Satz mit dem richtigen Bereich und dem richtigen Fachmann.", "We’re upfront": "Wir sind offen", "We write up front what we do, what we do with authorised partners and what we don’t. We guarantee method, evidence and scope, not outcomes.": "Wir schreiben vorab, was wir tun, was wir mit zugelassenen Partnern tun und was nicht. Wir garantieren Methode, Nachweis und Umfang, nicht das Ergebnis.", "Our experts": "Unsere Experten", "Here we explain in plain language how the information you leave with us is used.": "Hier erklären wir verständlich, wie die Informationen genutzt werden, die Sie uns überlassen.", "What information do we collect?": "Welche Informationen erheben wir?", "The details you enter in the free Quick Check-up form: name, company, phone, optional email, number of employees, sector, selected topics, preferred times and your note. If you write to us on WhatsApp or by email, the content you send and your contact details.": "Die Angaben im kostenlosen Schnell-Check-up-Formular: Name, Unternehmen, Telefon, optional E-Mail, Mitarbeiterzahl, Branche, gewählte Themen, bevorzugte Zeiten und Ihre Notiz. Wenn Sie uns per WhatsApp oder E-Mail schreiben, den Inhalt und Ihre Kontaktdaten.", "Why do we use it?": "Wozu nutzen wir sie?", "To assess your request, plan the meeting and get in touch with you. We don’t add your details to marketing lists or sell them.": "Um Ihre Anfrage zu bewerten, das Gespräch zu planen und Sie zu kontaktieren. Wir nehmen Ihre Daten nicht in Marketinglisten auf und verkaufen sie nicht.", "Who is it shared with?": "Mit wem werden sie geteilt?", "The Check-up form reaches our team by email through a form-service provider. Where your topic requires, details are shared with authorised partners (e.g. legal, CPA) only with your knowledge and consent. If you write via WhatsApp, WhatsApp’s own terms also apply.": "Das Check-up-Formular erreicht unser Team per E-Mail über einen Formulardienst. Wo Ihr Thema es erfordert, werden Angaben nur mit Ihrem Wissen und Einverständnis mit zugelassenen Partnern (z. B. Recht, Steuerberatung) geteilt. Schreiben Sie über WhatsApp, gelten auch dessen Bedingungen.", "How long is it kept?": "Wie lange werden sie gespeichert?", "For as long as needed to conclude your request and meet legal obligations; afterwards deleted or anonymised.": "So lange, wie es für Ihre Anfrage und gesetzliche Pflichten nötig ist; danach gelöscht oder anonymisiert.", "Cookies and browser data": "Cookies und Browserdaten", "We use no advertising or tracking cookies. Only your chosen language (TR/EN) is stored in your browser.": "Wir verwenden keine Werbe- oder Tracking-Cookies. Nur Ihre gewählte Sprache und Währung werden im Browser gespeichert.", "Your rights": "Ihre Rechte", "Under Article 11 of Law No. 6698 on the Protection of Personal Data you have rights such as learning whether your data is processed, requesting information, and asking for correction or deletion. You can write to bilgi@orbitkontrol.com.": "Nach Artikel 11 des Gesetzes Nr. 6698 zum Schutz personenbezogener Daten haben Sie unter anderem das Recht zu erfahren, ob Ihre Daten verarbeitet werden, Auskunft zu verlangen und Berichtigung oder Löschung zu beantragen. Schreiben Sie an bilgi@orbitkontrol.com.", "See where the company’s money is and where it goes.": "Sehen, wo das Geld des Unternehmens ist und wohin es fließt.", "Clients usually ask us:": "Kunden fragen uns in diesem Bereich meist:", "When will my money come in, and from whom?": "Wann und von wem kommt mein Geld?", "Is my collateral worth what I think?": "Sind meine Sicherheiten so viel wert, wie ich denke?", "Are my books and tax process reliable?": "Sind meine Bücher und Steuerprozesse verlässlich?", "Where do I earn, and where do I lose?": "Wo verdiene ich und wo verliere ich?", "Do I need every cost I’ve paid for years?": "Brauche ich alle Kosten, die ich seit Jahren zahle?", "What support can I benefit from?": "Welche Förderungen kann ich nutzen?", "Open any row to see scope and output. ● Orbit does it · ◐ Orbit + authorised partner · ○ partner does it, Orbit coordinates.": "Öffnen Sie eine Zeile, um Umfang und Ergebnis zu sehen. ● Orbit erledigt es · ◐ Orbit + zugelassener Partner · ○ Partner erledigt es, Orbit koordiniert.", "Package descriptions are currently in Turkish; message us for English.": "Paketbeschreibungen sind derzeit auf Türkisch; schreiben Sie uns für Details.", "Which service packages include this area?": "Welche Leistungspakete enthalten diesen Bereich?", "Limits and partners": "Grenzen und Partner", "Orbit does internal-control reviews; independent audit, certification, filings and books belong to your CPA. Collateral appraisal is done by a licensed valuation body. No credit brokerage or investment advice.": "Orbit führt Prüfungen der internen Kontrolle durch; Abschlussprüfung, Testate, Erklärungen und Bücher liegen bei Ihrem Steuerberater. Sicherheiten bewertet eine zugelassene Bewertungsstelle. Keine Kreditvermittlung oder Anlageberatung.", "Hello, I’d like support in the Money area.": "Hallo, ich möchte Unterstützung im Bereich Finanzen.", "Make work run independent of individuals, defined and measurable: purchasing, sales, stock, logistics and authority.": "Arbeit personenunabhängig, definiert und messbar machen: Einkauf, Verkauf, Lager, Logistik und Befugnisse.", "Are my purchases and sales clean?": "Sind meine Einkäufe und Verkäufe sauber?", "Does my stock really exist, at the right value?": "Gibt es meinen Bestand wirklich, zum richtigen Wert?", "Is my shipping efficient?": "Ist mein Versand effizient?", "Who does what, with what authority?": "Wer tut was, mit welcher Befugnis?", "Are my recipes, waste and margins right?": "Stimmen meine Rezepturen, mein Schwund und meine Margen?", "Orbit does sample testing, phone verification, field and count observation; bookkeeping and tax advice are out of scope. Legal aspects such as signing authority are assessed with the legal partner.": "Orbit führt Stichproben, telefonische Bestätigungen, Vor-Ort- und Inventurbeobachtung durch; Buchhaltung und Steuerberatung sind nicht enthalten. Rechtliche Aspekte wie Zeichnungsbefugnisse werden mit dem Rechtspartner bewertet.", "Hello, I’d like support in the Systems area.": "Hallo, ich möchte Unterstützung im Bereich Systeme.", "Define software needs and judge whether current software is enough; integrate it if so, build custom software if not. Make data, systems and communications visibly safe. Decision flow: needs definition (B1) → existing-software review (B2) → if it meets the need, integration with ERP and other systems (B6); if not, custom software (B7).": "Softwarebedarf ermitteln und beurteilen, ob die vorhandene Software genügt; wenn ja integrieren, wenn nicht individuell entwickeln. Daten, Systeme und Kommunikation sichtbar sicher machen. Entscheidungsweg: Bedarfsermittlung (B1) → Prüfung bestehender Software (B2) → wenn sie passt, Integration mit ERP und anderen Systemen (B6); wenn nicht, Individualsoftware (B7).", "Does my software meet my needs?": "Deckt meine Software meinen Bedarf?", "Do my systems talk to each other?": "Sprechen meine Systeme miteinander?", "What if off-the-shelf software doesn’t fit?": "Was, wenn Standardsoftware nicht passt?", "Where are my vehicles and how are they used?": "Wo sind meine Fahrzeuge und wie werden sie genutzt?", "Do my documents and processes flow digitally?": "Laufen meine Belege und Prozesse digital?", "Are my decisions based on data?": "Beruhen meine Entscheidungen auf Daten?", "Are my data and communications safe?": "Sind meine Daten und meine Kommunikation sicher?", "Penetration tests are only run with the client’s written consent and a licensed partner; Orbit performs cyber-hygiene scans. Extra development capacity comes from IT partners; source-code and licence terms are written into the contract.": "Penetrationstests erfolgen nur mit schriftlicher Zustimmung des Kunden und durch einen zugelassenen Partner; Orbit führt Cyber-Hygiene-Scans durch. Zusätzliche Entwicklungskapazität kommt von IT-Partnern; Quellcode- und Lizenzbedingungen stehen im Vertrag.", "Hello, I’d like support in the IT area.": "Hallo, ich möchte Unterstützung im Bereich IT.", "Make the company’s legal, people, ethics and compliance risks visible.": "Rechtliche, personelle, ethische und Compliance-Risiken des Unternehmens sichtbar machen.", "What are my contract and structure gaps?": "Wo sind meine Vertrags- und Strukturlücken?", "Who and what am I dependent on?": "Von wem und wovon bin ich abhängig?", "Is there a leak, conflict-of-interest or bribery risk?": "Gibt es Leck-, Interessenkonflikt- oder Bestechungsrisiken?", "Am I ready for regulation and buyer requirements?": "Bin ich bereit für Regulierung und Käuferanforderungen?", "Legal opinions, contract drafting, litigation and enforcement belong to the authorised legal partner; Orbit does contract inventories and risk flagging. The ethics hotline is optional.": "Rechtsgutachten, Vertragsentwürfe, Prozesse und Vollstreckung liegen beim zugelassenen Rechtspartner; Orbit erstellt Vertragsinventare und kennzeichnet Risiken. Die Ethik-Hotline ist optional.", "Hello, I’d like support in the Trust area.": "Hallo, ich möchte Unterstützung im Bereich Vertrauen.", "Keep the business standing against disaster, outage, supply and insurance risk.": "Den Betrieb gegen Katastrophen-, Ausfall-, Liefer- und Versicherungsrisiken stabil halten.", "What if there’s fire, earthquake or flood?": "Was, wenn es brennt, bebt oder überflutet?", "What if production, supply or infrastructure stops?": "Was, wenn Produktion, Lieferung oder Infrastruktur ausfallen?", "Does my insurance really cover my risk?": "Deckt meine Versicherung mein Risiko wirklich?", "Official OHS services belong to the licensed provider (F5 is a systems and records check). Insurance advice and policy placement are done with the insurance partner. Orbit provides no protection or emergency-response service.": "Offizielle Arbeitsschutzleistungen liegen beim zugelassenen Anbieter (F5 ist eine System- und Dokumentenprüfung). Versicherungsberatung und Policenplatzierung erfolgen mit dem Versicherungspartner. Orbit bietet keinen Personenschutz und keine Notfalleinsätze.", "Hello, I’d like support in the Physical Risks area.": "Hallo, ich möchte Unterstützung im Bereich Physische Risiken.", "The visibility and discipline layer above the other five.": "Die Transparenz- und Ordnungsebene über den anderen fünf Bereichen.", "Is the system we built still working?": "Funktioniert das aufgebaute System noch?", "Am I ready as I grow, hand over or merge?": "Bin ich bereit zu wachsen, zu übergeben oder zu fusionieren?", "Is my association run in an orderly, institutional way?": "Läuft mein Verein geordnet und institutionell?", "Continuous control: subscriptions": "Laufende Kontrolle: Abonnements", "A system isn’t finished once built; we keep checking it works. Every subscription month includes at least one random sample test, with results and actions shown in the management report.": "Ein System ist mit dem Aufbau nicht fertig; wir prüfen weiter, dass es funktioniert. Jeder Abonnementmonat enthält mindestens eine Zufallsstichprobe; Ergebnisse und Maßnahmen erscheinen im Managementbericht.", "The 12 indicators of the management dashboard": "Die 12 Kennzahlen des Management-Dashboards", "The nine questions every manager wants answered": "Die neun Fragen, die jede Führungskraft beantwortet haben will", "How is the company doing right now?": "Wie steht das Unternehmen gerade da?", "Where is my money?": "Wo ist mein Geld?", "What am I owed, and what do I owe?": "Was schuldet man mir, und was schulde ich?", "Which products and customers make money, and where do I lose?": "Welche Produkte und Kunden bringen Geld, und wo verliere ich?", "Which process is stalling?": "Welcher Prozess stockt?", "Who does what, and which people is the company dependent on?": "Wer macht was, und von welchen Personen hängt das Unternehmen ab?", "What are my biggest risks?": "Was sind meine größten Risiken?", "If a crisis hits, how long can I keep running?": "Wie lange kann ich im Krisenfall weiterarbeiten?", "What should I do over the next 3–6–12 months?": "Was sollte ich in den nächsten 3–6–12 Monaten tun?", "The emergency advice line in Corporate Membership is a referral and coordination line, not protection or emergency response. Legal and insurance partners join Orbit Masası when needed.": "Die Notfall-Beratungslinie der Firmenmitgliedschaft ist eine Vermittlungs- und Koordinationslinie, kein Personenschutz und kein Notfalleinsatz. Rechts- und Versicherungspartner nehmen bei Bedarf am Orbit Masası teil.", "Hello, I’d like support in the Management area.": "Hallo, ich möchte Unterstützung im Bereich Management.", "Please choose at least one topic and one time slot.": "Bitte wählen Sie mindestens ein Thema und einen Zeitraum.", "Amount": "Betrag", "Hello, I’d like to buy / get information about this Office Task:": "Hallo, ich möchte diese Bürodienstleistung kaufen bzw. Informationen dazu erhalten:", "Quantity": "Menge", "FREE ADVISORY CALL": "KOSTENLOSES BERATUNGSGESPRÄCH", "Free Quick Check-up": "Kostenloser Schnell-Check-up", "Answer a few short questions and pick the times that suit you. We’ll arrange a free call around your topics.": "Beantworten Sie ein paar kurze Fragen und wählen Sie passende Termine. Wir vereinbaren ein kostenloses Gespräch zu Ihren Themen.", "1. Which topics would you like to develop or talk about? (pick any)": "1. Über welche Themen möchten Sie sprechen oder was möchten Sie verbessern? (Mehrfachauswahl)", "Money & finance": "Geld & Finanzen", "Operations, stock & processes": "Betrieb, Lager & Prozesse", "IT & software": "IT & Software", "Legal, people & ethics": "Recht, Personal & Ethik", "Crisis, disaster & insurance": "Krise, Katastrophe & Versicherung", "Management & growth": "Management & Wachstum", "Grants & incentives": "Förderungen & Anreize", "2. How many employees?": "2. Wie viele Mitarbeitende haben Sie?", "3. Your sector / line of business": "3. Ihre Branche / Tätigkeit", "4. Times that suit you (choose as many as you like)": "4. Passende Termine (beliebig viele wählen)", "5. How can we reach you?": "5. Wie erreichen wir Sie?", "Send my request": "Anfrage senden", "We’ve received your request. We’ll review the times you chose and get in touch to confirm a suitable slot.": "Ihre Anfrage ist eingegangen. Wir prüfen die gewählten Zeiten und melden uns, um einen passenden Termin zu bestätigen.", "Keep control while your company grows.": "Behalten Sie die Kontrolle, während Ihr Unternehmen wächst.", "Our Areas": "Unsere Bereiche", "Reach Us": "Kontakt", "Orbit does not provide legal, accounting or independent audit services or insurance brokerage; these are performed by authorised partners. Content on this site is not legal or financial advice.": "Orbit erbringt keine Rechtsberatung, Buchhaltung, Abschlussprüfung oder Versicherungsvermittlung; diese übernehmen zugelassene Partner. Die Inhalte dieser Website sind keine Rechts- oder Finanzberatung.", "Cash": "Liquidität", "Receivables (ageing)": "Forderungen (Alterung)", "Payables": "Verbindlichkeiten", "Profitability": "Rentabilität", "Sales": "Umsatz", "Expenses": "Ausgaben", "Risk": "Risiko", "Open actions": "Offene Maßnahmen", "Key-person dependency": "Abhängigkeit von Schlüsselpersonen", "Outage resilience": "Ausfallresilienz", "Collection delay": "Inkassoverzug", "System compliance score": "Systemkonformitätswert", "Foreign-currency amounts use the CBRT forex buying rate ({d}: 1 {c} = {r} TL). Invoicing is in TL.": "Fremdwährungsbeträge basieren auf dem Devisenankaufskurs der türkischen Zentralbank ({d}: 1 {c} = {r} TL). Die Rechnungsstellung erfolgt in TL.", "Monitor": "Überwachung", "In the first meeting we listen to your business and find together where the problem starts. Then we prioritise the findings and draw up a simple roadmap showing which step to take, and when.": "Im ersten Gespräch hören wir Ihrem Unternehmen zu und finden gemeinsam heraus, wo das Problem beginnt. Dann priorisieren wir die Ergebnisse und erstellen einen einfachen Fahrplan, der zeigt, welcher Schritt wann zu gehen ist.", "We don’t hand over the system and walk away; we verify at days 30 and 90 that it works and, if you wish, stay beside you with regular checks.": "Wir übergeben das System nicht einfach und gehen; nach 30 und 90 Tagen prüfen wir, ob es funktioniert, und begleiten Sie auf Wunsch mit regelmäßigen Kontrollen.", "Six areas, over 100 services, one list.": "Sechs Bereiche, über 100 Leistungen, eine Liste.", "Pick only what you need; we combine your choices into one plan and make clear who does what, and when. Not sure where to start? Begin with the free Quick Check-up and we’ll choose the right services together.": "Wählen Sie nur, was Sie brauchen; wir fassen Ihre Auswahl in einem Plan zusammen und klären, wer was wann erledigt. Unsicher, wo Sie anfangen sollen? Beginnen Sie mit dem kostenlosen Schnell-Check-up – wir wählen die passenden Leistungen gemeinsam.", "You see prices upfront; pick a quantity and send your request in one click. Our experienced team delivers within the stated time and in confidence.": "Sie sehen die Preise vorab, wählen die Menge und senden Ihre Anfrage mit einem Klick. Unser erfahrenes Team liefert in der angegebenen Zeit und vertraulich.", "Association Administration": "Vereinsverwaltung", "Scripts & Publishing": "Drehbücher & Publikationen", "Are the financial scenes in my script or book realistic?": "Sind die Finanzszenen in meinem Drehbuch oder Buch realistisch?", "Financial Realism Consulting for Scripts & Books": "Finanz-Realismusberatung für Drehbücher & Bücher", "Realism, consistency and jargon check of financial scenes and dialogue; flagging wrong or unconvincing lines and suggesting accurate alternatives; consistency of figures, dates, titles and processes across the story; a short jargon glossary fitting the character’s profession; optional 1-hour call": "Realismus-, Konsistenz- und Fachjargonprüfung von Finanzszenen und Dialogen; Kennzeichnung falscher oder unglaubwürdiger Sätze mit korrekten Alternativen; Konsistenz von Zahlen, Daten, Titeln und Abläufen in der ganzen Geschichte; kurzes Fachglossar passend zum Beruf der Figur; optional 1 Stunde Gespräch", "page": "Seite", "Writers and producers of film, TV, stage scripts or novels who don’t know what to write in scenes involving companies, banks, accounting, tax, stock markets, bankruptcy, inheritance or fraud": "Autorinnen, Autoren und Produzenten von Film-, Serien-, Theaterdrehbüchern oder Romanen, die nicht wissen, was sie in Szenen über Unternehmen, Banken, Buchhaltung, Steuern, Börse, Insolvenz, Erbschaft oder Betrug schreiben sollen", "Up to 30 pages: 3 business days; longer texts in steps": "Bis 30 Seiten: 3 Werktage; längere Texte gestaffelt", "The relevant scenes or chapters (Word or PDF), a short synopsis, period and setting, the characters’ professions": "Die betreffenden Szenen oder Kapitel (Word oder PDF), kurze Inhaltsangabe, Zeit und Ort der Handlung, Berufe der Figuren"}, "ru": {"What We Do": "Что мы делаем", "How We Work": "Как мы работаем", "Services": "Услуги", "Office Tasks": "Офисные задачи", "Our Experts": "Наши эксперты", "Contact": "Контакты", "Free Check-up": "Бесплатный чек-ап", "BUSINESS CONTROL & SYSTEM DESIGN": "КОНТРОЛЬ БИЗНЕСА И ПРОЕКТИРОВАНИЕ СИСТЕМ", "Keep control <em>while your business grows.</em>": "Сохраняйте контроль, <em>пока ваш бизнес растёт.</em>", "Where is your money, do your systems understand each other, do you know your risks and are you ready? Together with our specialists we look at it all as one: we see, build and monitor.": "Где ваши деньги, понимают ли ваши системы друг друга, знаете ли вы свои риски и готовы ли вы? Вместе с нашими специалистами мы смотрим на всё как на единое целое: видим, выстраиваем и контролируем.", "What do we do?": "Что мы делаем", "OUR AREAS": "НАШИ НАПРАВЛЕНИЯ", "Your business’s sustainability depends on all of its systems working together in harmony and working correctly.": "Устойчивость вашего бизнеса зависит от того, насколько слаженно и правильно работают все его системы.", "A business doesn’t break in just one place. Every step is valuable. If we can’t take hold of money and can’t control it, it can end everything. If process and authority are undefined, leakage follows. If software and data don’t carry the work, efficiency drops. If legal, human and ethical risks stay hidden, trust erodes or damage that is impossible to recover from can occur. If there’s no readiness for disaster, outage or supply risk, work stops. The management layer makes all of it regularly visible.": "Бизнес ломается не в одном месте. Важен каждый шаг. Если мы не управляем деньгами и не контролируем их, это может погубить всё. Если процессы и полномочия не определены, возникают утечки. Если программы и данные не поддерживают работу, падает эффективность. Если правовые, человеческие и этические риски остаются скрытыми, теряется доверие или возникает ущерб, который невозможно восполнить. Без готовности к катастрофам, сбоям и рискам поставок работа останавливается. Управленческий уровень делает всё это регулярно видимым.", "Money": "Деньги", "Am I on top of my money? Where is it, and where does it go? Am I doing what it takes to keep it from being stolen?": "Управляю ли я своими деньгами? Где они и куда уходят? Делаю ли я всё, чтобы их не украли?", "See the details": "Подробнее", "Systems": "Системы", "Are my purchasing, sales, stock, logistics and authority definitions under control?": "Под контролем ли у меня закупки, продажи, склад, логистика и полномочия?", "IT": "ИТ", "Does my software carry my business? Do my systems talk to each other, and is my data safe?": "Поддерживают ли программы мой бизнес? Связаны ли мои системы между собой и защищены ли данные?", "Trust": "Доверие", "Who and what am I dependent on? Are contract, leak, conflict-of-interest and compliance risks visible?": "От кого и от чего я завишу? Видны ли риски по договорам, утечкам, конфликтам интересов и соответствию требованиям?", "Physical Risks": "Физические риски", "If fire, earthquake, flood or an outage hits, does the business stop? Does my insurance really cover the risk?": "Остановится ли бизнес при пожаре, землетрясении, наводнении или сбое? Действительно ли страховка покрывает риск?", "Management": "Управление", "Where does my company stand today? Is the system we built still working? Am I ready to grow, hand over or merge?": "Где сейчас моя компания? Работает ли построенная система? Готов ли я к росту, передаче бизнеса или слиянию?", "OUR METHOD": "НАШ МЕТОД", "From assessment to verification.": "От диагностики до подтверждения.", "We work with one four-step method: we see the situation, advise, build the system and verify that it works.": "Мы работаем по единому методу из четырёх шагов: оцениваем ситуацию, даём рекомендации, выстраиваем систему и проверяем, что она работает.", "How we work": "Как мы работаем", "Assess": "Диагностика", "Where does my company stand today?": "Где сейчас моя компания?", "We understand the current situation through data, documents, interviews, processes and systems.": "Мы изучаем текущую ситуацию по данным, документам, интервью, процессам и системам.", "Advise": "Рекомендации", "What are the solution options?": "Какие есть варианты решения?", "We prioritise the findings and build a 3, 6 and 12-month roadmap.": "Мы расставляем приоритеты и составляем дорожную карту на 3, 6 и 12 месяцев.", "Build": "Внедрение", "The system is designed and in place.": "Система спроектирована и внедрена.", "We design and set up processes, authority, reporting, systems and continuity plans.": "Мы проектируем и внедряем процессы, полномочия, отчётность, системы и планы непрерывности.", "Verify & monitor": "Проверка и мониторинг", "The system really works.": "Система действительно работает.", "Where appropriate we verify at days 30 and 90, then monitor regularly.": "Где уместно, мы проверяем результат на 30-й и 90-й день, затем регулярно контролируем.", "FOR SMALL BUSINESSES": "ДЛЯ МАЛОГО БИЗНЕСА", "Daily Office Tasks": "Ежедневные офисные задачи", "Hand over the matters you don’t want to lose time on and focus on your business. In one-person or 3–5 person businesses, you can buy packaged services for the work you have no department or specialist for.": "Передайте нам дела, на которые не хотите тратить время, и сосредоточьтесь на бизнесе. Компании из одного или 3–5 человек могут купить пакетные услуги для работ, на которые у них нет отдела или специалиста.", "Sales & Quotes": "Продажи и предложения", "Are my quotes, price list, presentations and supplier market research in order?": "В порядке ли мои коммерческие предложения, прайс-лист, презентации и исследование рынка поставщиков?", "services": "услуг", "Receivables & Accounts": "Дебиторка и расчёты", "Are my receivables and accounts being followed up?": "Отслеживаются ли моя дебиторская задолженность и расчёты с контрагентами?", "Credit & Finance Preparation": "Подготовка к кредиту и финансированию", "Is the file I’m submitting to the bank ready?": "Готов ли пакет документов для банка?", "Documents & Bookkeeping Prep": "Документы и подготовка к бухгалтерии", "Are my documents ready for my accountant?": "Готовы ли мои документы для бухгалтера?", "Field & Reporting": "Выездные работы и отчётность", "Are my stock count and monthly report ready on time?": "Вовремя ли готовы инвентаризация и ежемесячный отчёт?", "Personnel & Official Matters": "Персонал и официальные вопросы", "Are my personnel-related official letters and permits handled on time?": "Вовремя ли решаются официальные письма и разрешения по персоналу?", "Association Matters": "Дела ассоциаций", "Is my association set up properly, with its administration in order?": "Правильно ли создана моя ассоциация и налажено ли управление?", "All Office Tasks": "Все офисные задачи", "See prices, pick a quantity and request right away.": "Смотрите цены, выбирайте количество и сразу оставляйте заявку.", "Browse": "Смотреть", "OUR TEAM": "НАША КОМАНДА", "Our team has two rings. We design the system and run the control work; our solution partners step in for specialist and regulated work.": "Наша команда состоит из двух кругов. Мы проектируем систему и выполняем контроль; партнёры по решениям подключаются к специализированным и регулируемым работам.", "Our Expert Team": "Наша команда экспертов", "They design the system and run the control work. Every project has a lead and a second reviewer, so you rely on two sets of eyes, not one person’s opinion.": "Они проектируют систему и выполняют контроль. В каждом проекте есть ответственный и второй проверяющий — вы опираетесь на две пары глаз, а не на мнение одного человека.", "Systems design": "Проектирование систем", "Internal & financial control": "Внутренний и финансовый контроль", "Software & ERP": "ПО и ERP", "Cybersecurity": "Кибербезопасность", "Business continuity": "Непрерывность бизнеса", "Association setup": "Создание ассоциаций", "Our solution partners": "Наши партнёры по решениям", "Solution partners whose professional advice we draw on where their expertise is needed; they carry out regulated and licensed work under their own contracts and responsibility.": "Партнёры, к чьим профессиональным консультациям мы обращаемся там, где нужна их экспертиза; регулируемые и лицензируемые работы они выполняют по собственным договорам и под свою ответственность.", "Lawyer": "Юрист", "CPA / Sworn CPA": "Бухгалтер / аудитор (SMMM / YMM)", "Insurance": "Страхование", "OHS provider": "Служба охраны труда", "Quality & QESH": "Качество и ОТ/ПБ/ООС", "Data & IT": "Данные и ИТ", "Grants & support": "Гранты и поддержка", "Corporate identity": "Фирменный стиль", "Collateral appraisal": "Оценка залогов", "Meet our experts": "Познакомьтесь с экспертами", "Reach us quickly.": "Свяжитесь с нами быстро.", "Tell us what’s on your mind, and we’ll talk plainly about what we can do, how, and how long it takes.": "Расскажите, что вас волнует, и мы просто объясним, что можем сделать, как и за какой срок.", "Message on WhatsApp": "Написать в WhatsApp", "Hello, I’d like to talk to Orbit Kontrol.": "Здравствуйте, я хотел(а) бы поговорить с Orbit Kontrol.", "Other: a few words": "Другое: кратко опишите", "e.g. textile manufacturing, wholesale…": "напр. текстильное производство, оптовая торговля…", "Full name": "Имя и фамилия", "Company": "Компания", "Phone": "Телефон", "Email (optional)": "E-mail (необязательно)", "Anything to add (optional)": "Дополнительно (необязательно)", "Complete Service List": "Полный список услуг", "About us": "О нас", "Privacy & KVKK": "Конфиденциальность и KVKK", " – Keep control while your company grows": " – Сохраняйте контроль, пока компания растёт", "We work across complementary core areas so your business keeps standing. You don’t need to know service names; pick the question closest to yours and we’ll go into detail.": "Мы работаем в дополняющих друг друга ключевых направлениях, чтобы ваш бизнес оставался устойчивым. Знать названия услуг не нужно: выберите вопрос, ближе всего к вашему, и мы перейдём к деталям.", "We work out how you can take hold of your money. To remove the losses caused by missing systems and work that is disconnected and not integrated, we connect every job to the others. We make your software talk to each other.": "Мы находим, как вам взять деньги под контроль. Чтобы устранить потери от отсутствия систем и разрозненной, неинтегрированной работы, мы связываем каждую задачу с остальными. Мы делаем так, чтобы ваши программы «общались» друг с другом.", "We check whether you work in a safe space legally and in terms of insurance. We look together at which measures you can take against disasters and the setbacks that could turn into disasters. So you can make the right management decisions, we let you see your business correctly through reports.": "Мы проверяем, работаете ли вы в безопасной среде с юридической и страховой точки зрения. Вместе смотрим, какие меры можно принять против катастроф и неудач, способных в них перерасти. Чтобы вы принимали верные управленческие решения, мы показываем бизнес через понятные отчёты.", "We make visible where the money is, where it goes and how it is protected.": "Мы показываем, где деньги, куда они уходят и как защищены.", "Cash, Collections & Accounts": "Денежные средства, инкассация и расчёты", "Cheques, Notes & Collateral": "Чеки, векселя и залоги", "Accounting Accuracy & Tax Readiness": "Точность учёта и налоговая готовность", "Profitability, Budget & Financing": "Рентабельность, бюджет и финансирование", "Expense & Cost Efficiency": "Эффективность расходов и затрат", "Grants, Support & Incentives": "Гранты, поддержка и льготы", "We make the work run defined and measurable, independent of individuals, and set up the authority and signing structure.": "Мы делаем так, чтобы работа шла по правилам и измеримо, независимо от отдельных людей, и выстраиваем систему полномочий и подписей.", "Purchasing & Sales Control": "Контроль закупок и продаж", "Stock & Inventory": "Склад и запасы", "Logistics & Shipping": "Логистика и доставка", "Process, Authority & Field Operations": "Процессы, полномочия и полевые операции", "Sector Controls: Food": "Отраслевой контроль: общепит", "We connect your software, build new where needed and keep your data safe.": "Мы связываем ваши программы, при необходимости разрабатываем новые и защищаем данные." nd correspondence files": "Счета, накладные, заказы и переписка", "Documents requiring audit, certification or CPA sign-off are issued by the authorised partner under their own contract.": "Документы, требующие аудита, заверения или подписи SMMM / YMM, оформляет уполномоченный партнёр по собственному договору.", "Businesses applying for a bank loan that want the tables, calculations and file the bank requires prepared, and those that must document percentage of completion on projects such as construction": "Компании, подающие заявку на кредит и желающие подготовить требуемые банком таблицы, расчёты и досье, а также проекты (напр. строительные), где нужно подтвердить процент выполнения", "3–5 business days with a complete trial balance; completion calculations vary with project data": "3–5 рабочих дней при полной ОСВ; расчёты выполнения зависят от данных проекта", "Current trial balance, balance sheet and income statement, the bank’s document list, project budget and cost items (for construction), contracts and progress-payment details": "Актуальная ОСВ, баланс и отчёт о прибылях, список документов банка, бюджет и статьи затрат проекта (для строительства), договоры и данные по актам", "Those who want to bring receipts and invoices to their accountant in an orderly, trackable way": "Тем, кто хочет передавать чеки и счета бухгалтеру упорядоченно и отслеживаемо", "Up to 100 documents: 2 business days, then in steps": "До 100 документов: 2 рабочих дня, далее поэтапно", "Legible document photos, serial-number range, your accountant’s Excel layout preference": "Читаемые фото документов, диапазон номеров, формат Excel, удобный вашему бухгалтеру", "Those struggling to match bank statements to accounts": "Тем, кому сложно сопоставлять банковские выписки со счетами", "Up to 1,000 transactions: 2 business days": "До 1 000 операций: 2 рабочих дня", "Bank statement (Excel or PDF), account list": "Банковская выписка (Excel или PDF), список контрагентов", "Those with a messy archive who want documents in order": "Тем, у кого беспорядок в архиве и кто хочет навести порядок", "Up to 100 files: 3 business days, then in steps": "До 100 дел: 3 рабочих дня, далее поэтапно", "Document bundle or photos": "Пакет документов или фото", "Those with scattered contracts who miss deadlines": "Тем, у кого договоры разбросаны и сроки упускаются", "Up to 10 contracts: 3 business days": "До 10 договоров: 3 рабочих дня", "Scanned contracts": "Отсканированные договоры", "Those running a year-end or surprise count who want its accuracy confirmed by an independent eye": "Тем, кто проводит годовую или внезапную инвентаризацию и хочет независимо подтвердить её точность", "By appointment, per day": "По записи, посуточно", "Product or count list, system stock records, warehouse access, count lead": "Список товаров или пересчёта, учётные остатки в системе, доступ на склад, ответственный за инвентаризацию", "Extra travel allowance applies outside Istanbul.": "За пределами Стамбула взимаются дополнительные командировочные.", "Note": "Примечание", "Those who don’t have time to compile their own report": "Тем, у кого нет времени самим собирать отчёт", "5th business day after month-end": "5-й рабочий день после закрытия месяца", "Depends on the report you want: sales performance, expenses or profitability, for example. In the first meeting we agree the report type and list the data needed (bank statements, sales and expense records, stock data etc.)": "Зависит от нужного отчёта: например, эффективность продаж, расходы или рентабельность. На первой встрече мы определяем тип отчёта и список нужных данных (выписки, данные продаж и расходов, складские данные и т. д.)", "The first month adds 3,000 TL for report design, so month one is 3,000 + 2,500 TL. Following months continue at 2,500 TL / month.": "В первый месяц добавляется 3 000 TL за разработку формы отчёта, то есть первый месяц — 3 000 + 2 500 TL. Далее — 2 500 TL в месяц.", " / month": " / месяц", "Official and legal parts are carried out by our authorised lawyer partner under their own contract; Orbit handles preparation, documents, follow-up and coordination.": "Официальную и юридическую часть выполняет наш уполномоченный партнёр-юрист по собственному договору; Orbit берёт на себя подготовку, документы, отслеживание и координацию.", "Businesses that receive enforcement-office letters about an employee (salary garnishment, garnishment notices) and want to reply correctly and on time": "Компании, получающие письма исполнительной службы о сотруднике (удержание из зарплаты, уведомление об аресте) и желающие ответить правильно и вовремя", "1 business day after the letter and details arrive; please send the letter the day you receive it so the deadline stated in it isn’t missed": "1 рабочий день после получения письма и данных; пришлите письмо в день получения, чтобы не пропустить указанный в нём срок", "Copy of the enforcement letter, employee’s status (still employed or left), salary and current deductions, authorised signatory’s details, mailing address": "Копия письма исполнительной службы, статус сотрудника (работает или уволен), зарплата и текущие удержания, данные подписанта, почтовый адрес", "Businesses that want to hire a foreign national or renew a permit": "Компании, которые хотят нанять иностранца или продлить разрешение", "Application preparation in 2–3 business days with complete documents; the decision time depends on the authority": "Подготовка заявки 2–3 рабочих дня при полном пакете; срок решения зависит от ведомства", "Company details, the employee’s passport and diploma/profession details, draft employment contract, your signatory’s e-signature, previous permit if any": "Данные компании, паспорт и диплом/профессия сотрудника, проект трудового договора, электронная подпись уполномоченного лица, предыдущее разрешение (если есть)", "Founders who want to set up an association correctly and completely from day one": "Учредители, которые хотят с первого дня правильно и пол
