</script><script>window.CLD=[{"k":"P","name":"PARA","intro":"Şirketin parasının nerede olduğunu ve nereye gittiğini görmek.","hats":[{"n":"Nakit, Tahsilat ve Cari","q":"Param ne zaman, kimden gelecek?","p":[{"c":"P1","n":"Nakit Akışı Röntgeni","s":"Son 12 ayın banka hareketleri ve cari kayıtları incelenir, 13 haftalık nakit tahmin modeli kurulur.","o":"Excel nakit modeli + özet","y":"● Orbit"},{"c":"P2","n":"Alacak ve Tahsilat Sağlığı","s":"Yaşlandırma, gecikme günü, müşteri bazlı limit ve risk skoru, tahsilat rutini.","o":"alacak raporu + tahsilat prosedürü","y":"● Orbit"},{"c":"P3","n":"Cari Mutabakat Paketi","s":"Seçilen 50 cari için mutabakat yazısı, fark analizi ve düzeltme önerisi.","o":"mutabakat dosyası + fark listesi","y":"● Orbit"},{"c":"P4","n":"Kasa ve Banka Hareketi Teyidi","s":"Rastgele seçilen 20--30 kasa/banka hareketi, bankadan doğrudan alınan ham ekstre ile muhasebe kaydı arasında eşleştirilir. Her hareketin belgesi (fatura, sözleşme), onay izi ve ödemenin gittiği ya da geldiği tarafın (IBAN sahibi, cari kaydı) kayıtla uyumu kontrol edilir; yetkisiz ve belgesiz hareketler işaretlenir.","o":"eşleştirme tablosu + uyumsuzluk listesi","y":"● Orbit"}]},{"n":"Çek, Senet ve Teminat","q":"Teminatlarım gerçek değerinde mi?","p":[{"c":"P5","n":"Çek, Senet ve Teminat Envanteri","s":"Portföydeki ve verilen çek/senet/teminatların vade ve karşı taraf bazında envanteri; vade yoğunlaşması ve tahsil riski haritası.","o":"envanter + vade takvimi + risk işaretleri","y":"● Orbit"},{"c":"P6","n":"Teminat Gözden Geçirme ve Ekspertiz","s":"Verilen ve alınan teminatlar gözden geçirilir; mülk, arazi gibi teminatların ekspertizi yaptırılır ve teminat tutarları güncellenir. Bazı teminatlar TL, bazıları USD cinsinden tanımlı olabilir; güncel kurla reel durumları karşılaştırılır. Ekspertizi lisanslı değerleme kuruluşu yapar, Orbit süreci organize eder.","o":"teminat listesi + ekspertiz talepleri + güncel değer ve kur karşılaştırması","y":"◐ Orbit + iş ortağı"}]},{"n":"Muhasebe Doğruluğu ve Vergi Hazırlığı","q":"Kayıtlarım ve vergi sürecim güvenilir mi?","p":[{"c":"P7","n":"Mizan Tutarlılık Kontrolü","s":"Mizanın iç tutarlılık testleri: hesap eşleşmeleri, ters bakiyeler, kayıt disiplini. İç kontrol incelemesidir; denetim veya tasdik değildir, düzeltme kayıtları müşterinin SMMM'sinde kalır.","o":"bulgu listesi + düzeltme planı","y":"◐ Orbit + iş ortağı"},{"c":"P8","n":"Vergi Süreç ve Takvim Kontrolü","s":"Vergi takvimi, belge akışı ve sorumluluk dağılımı kontrolü; teşvik ve istisna konuları işaretlenir. Vergisel görüş SMMM/YMM iş ortağından.","o":"risk ve fırsat listesi","y":"◐ Orbit + iş ortağı"},{"c":"P9","n":"Transfer Fiyatlandırma Ön Haritası","s":"İlişkili taraf işlemlerinin haritası ve belgelendirme yükümlülüğünün ön işaretlenmesi; görüş YMM/vergi iş ortağından.","o":"ön görüş notu","y":"○ İş ortağı"}]},{"n":"Kârlılık, Bütçe ve Finansman","q":"Nereden kazanıyor, nerede kaybediyorum?","p":[{"c":"P10","n":"Kârlılık ve Maliyet Haritası","s":"Ürün/hizmet/müşteri bazlı maliyet ve kârlılık; zarar eden alanların tespiti.","o":"kârlılık modeli + yönetim özeti","y":"● Orbit"},{"c":"P11","n":"Yönetim Raporlama Seti","s":"Sahibin her ay göreceği 8 sayfalık rapor setinin tasarımı ve ilk 3 ayın hazırlanması.","o":"rapor şablonları + 3 aylık uygulama","y":"● Orbit"},{"c":"P12","n":"Bütçe Kurulumu","s":"Yıllık bütçe modeli, gerçekleşen karşılaştırma yapısı, sorumlu atamaları.","o":"bütçe modeli + takvim","y":"● Orbit"},{"c":"P13","n":"Finansman Hazırlık Dosyası","s":"Bankaya sunulacak yönetim paketi: nakit tablosu, borç-vade profili, teminat listesi, bütçe özeti, banka ilişki ve limit haritası. Kredi aracılığı veya yatırım tavsiyesi yoktur.","o":"finansman dosyası + banka ilişki haritası","y":"● Orbit"},{"c":"P14","n":"Kur ve Döviz Pozisyonu Haritası","s":"Döviz cinsi borç, alacak ve nakdin vade bazlı haritası; kur duyarlılık tablosu. İşlem tavsiyesi içermez.","o":"pozisyon haritası + duyarlılık tablosu","y":"● Orbit"}]},{"n":"Gider ve Maliyet Verimliliği","q":"Yıllardır ödediğim giderlerin hepsi gerekli mi?","p":[{"c":"P15","n":"Düzenli Gider İnceleme ve Verimlilik","s":"Yıllardır süregelen ve kimsenin sorgulamadığı düzenli giderler kalem kalem incelenir: telefon ve hat abonelikleri, internet ve veri paketleri, yazılım ve abonelik lisansları, kira ve aidatlar, bakım ve hizmet sözleşmeleri, sigorta ve diğer tekrarlayan ödemeler. Her kalem için gereklilik, kullanım düzeyi ve sözleşme koşulu tespit edilir; kullanılmayan veya gereksiz kalemlerin kapatılması ve kalanların uygun tarife ya da koşula geçirilmesi önerilir. Örnek: 120 hatlı bir işletmede çağrı almayan hatların tespiti, gereksizlerin kapatılması, kalan hatların kullanım profiline uygun tarifeye geçirilmesi.","o":"gider envanteri + kalem bazında gereklilik ve kullanım tablosu + kapatma ve tarife değişikliği listesi","y":"● Orbit"}]},{"n":"Hibe, Destek ve Teşvik","q":"Yararlanabileceğim destekler neler?","p":[{"c":"P16","n":"Hibe, Destek ve Teşvik Fırsat Haritası","s":"Uygunluk gösterilebilecek hibe, destek ve teşvik programlarının haritası; gerekli belge ve süreç listesi. Mali yön ve belge onayı SMMM/YMM ile.","o":"fırsat haritası + başvuru hazırlık listesi","y":"◐ Orbit + iş ortağı"},{"c":"P17","n":"İK Teşvik ve Destek Araştırması","s":"İstihdam, prim ve eğitim teşvikleri ile devlet desteklerinin taranması; işletmenin yararlanabileceği avantajların tespiti.","o":"teşvik haritası + başvuru ön hazırlık listesi","y":"◐ Orbit + iş ortağı"}]}]},{"k":"S","name":"SİSTEM","intro":"İşlerin kişilere bağlı olmadan, tanımlı ve ölçülebilir yürümesini sağlamak: satın alma, satış, stok, lojistik ve yetkiler.","hats":[{"n":"Satın Alma ve Satış Kontrolü","q":"Alım ve satışlarım temiz mi?","p":[{"c":"S1","n":"Satın Alma Süreç İncelemesi","s":"Talep--teklif--onay--sipariş--ödeme zinciri incelenir; son 6 ay örneklem testi; yetki ve görev ayrılığı. Teslim alınan ürünün kalitesinin teknik şartnameye veya faturaya uygun olup olmadığı fiziken kontrol edilir.","o":"bulgu raporu + kontrol önerileri","y":"● Orbit"},{"c":"S2","n":"Fatura Telefon Teyidi ve Fiili Teslim Kontrolü","s":"Seçilen faturalar düzenleyen firmayla telefonla teyit edilir: gerçekten kesildi mi, tutar ve vade doğru mu, satıcının cari ve IBAN bilgileri kayıtla uyumlu mu. Ürünün fiilen depoya girip girmediği kontrol edilir; akaryakıt gibi sayılamayan ürünlerde boşaltma video kaydı, irsaliyeyle gelen mallarda malın gerçekten indiğini gösteren görüntü izlenir.","o":"teyit tablosu + uyumsuzluk listesi","y":"● Orbit"},{"c":"S3","n":"Fiyat Kıyas ve Tedarikçi İlişki Taraması","s":"Aynı ürün için benzer şartlarda fiyat alınır; aradaki izah edilemez fark ve piyasa fiyatından sapma tespit edilir, satın alma departmanının görünmeyen bir komisyon ekleyip eklemediği kontrol edilir. Tedarikçi-çalışan ilişkisi ve tek kaynak riski kamuya açık veriyle taranır.","o":"kıyas tablosu + risk işaretleri","y":"● Orbit"},{"c":"S4","n":"Yeni Tedarikçi Onboarding Kontrolü","s":"Yeni tedarikçi kaydında vergi ve ticaret sicil teyidi, e-fatura durumu, banka hesabı sahibi uyumu, yetki ve tek kaynak riski; onboarding kontrol listesi kurulumu.","o":"onboarding prosedürü + ilk 20 tedarikçi taraması","y":"● Orbit"},{"c":"S5","n":"Satış ve Tahsilat Güvenliği İncelemesi","s":"Satış kaydı--fatura--tahsilat uyumu, vade ve ödeme biçimi güvenliği, çek/senet ve teminat.","o":"bulgu raporu","y":"● Orbit"},{"c":"S6","n":"İskonto, İade ve Komisyon Kontrolü","s":"Faturalaşma sonrasında kesilen iskonto, iade ve komisyon faturalarında usulsüzlük oranı yüksektir. Her birinin hangi faturaya ilişkin olduğu fatura üzerinde yazmalıdır; ilgili faturalarla eşleştirildiğinde net tutarın eksiye düşüp düşmediği, yetki ve gerçeklik açısından örneklem testiyle kontrol edilir.","o":"bulgu raporu + yetki önerileri","y":"● Orbit"},{"c":"S7","n":"Masraf, Avans ve Kurumsal Kart Kontrolü","s":"Masraf, avans, harcırah ve kurumsal kart harcamalarının politika ve belge uyumu; tekrar eden ve sınır altı harcama örüntüleri.","o":"bulgu raporu + masraf politikası taslağı","y":"● Orbit"}]},{"n":"Stok ve Envanter","q":"Stoğum gerçekten var mı, doğru değerde mi?","p":[{"c":"S8","n":"Sayım Düzeni ve Sayım Gözlemi","s":"Sayım planı ve talimatı gözden geçirilir. Sayımı biz yapmayız; müşteri ekibi sayarken gözlemci olarak eşlik edilir ve sayımın doğru yapılıp yapılmadığı fiilen izlenir. Depo yetkileri kontrol edilir.","o":"gözlem raporu + sayım düzeni önerisi","y":"● Orbit"},{"c":"S9","n":"Sayım Sonucu Girişi ve Fiili--Kayıt Farkı Analizi","s":"Sayım sonuçlarının sisteme doğru girilip girilmediği kontrol edilir; fiili ve kayıtlı stok farkları incelenir, fark nedenleri tahmin edilir (kayıt hatası, usulsüz çıkış, fire, kabul hatası).","o":"fark raporu + neden tahmin listesi","y":"● Orbit"},{"c":"S10","n":"Stok Devir Hızı ve Yavaş Hareket Eden Stok Analizi","s":"Özellikle eski firmalarda stokta kalmış ürünlerin tespiti, yaşlandırma ve stok devir hızı; stokta bağlanan sermaye ve ayrıştırma önerileri.","o":"stok yaşlandırma raporu + devir hızı tablosu","y":"● Orbit"},{"c":"S11","n":"Stok Değerleme Yöntemi İncelemesi","s":"Kullanılan stok değerleme yönteminin doğru ve tutarlı uygulanıp uygulanmadığı incelenir; değer düşüklüğü işaretleri çıkarılır. Tasdik veya vergisel görüş içermez, SMMM ile.","o":"değerleme bulgu listesi","y":"◐ Orbit + iş ortağı"},{"c":"S12","n":"Kabul Edilebilir Fire Oranı Belirleme","s":"Ürün grubu bazında kabul edilebilir fire oranları uluslararası normlar ve sektör referanslarına göre belirlenir; fiili fire ile kıyaslanır.","o":"fire oranı tablosu + sapma listesi","y":"● Orbit"},{"c":"S13","n":"Stok Eskime Riski: Teknoloji ve Son Kullanma Tarihi","s":"Teknolojik olarak eskime riski taşıyan stoklar ve son kullanma tarihi yaklaşan veya geçmiş ürünler tespit edilir; SKT takip düzeni kurulur.","o":"risk listesi + takip düzeni","y":"● Orbit"}]},{"n":"Lojistik ve Sevkiyat","q":"Sevkiyatlarım verimli mi?","p":[{"c":"S14","n":"Lojistik Verimlilik İncelemesi","s":"Sevkiyat rotaları, araç doluluğu, boş dönüş, teslim süreleri ve birim taşıma maliyeti incelenir.","o":"verimlilik raporu + iyileştirme listesi","y":"● Orbit"},{"c":"S15","n":"Rota Optimizasyonu ve Planlama Düzeni Kurulumu","s":"Rota planlama kuralları, performans göstergeleri ve planlama düzeni kurulur; araç takip sistemi (B8) verisiyle beslenir.","o":"optimizasyon modeli + planlama düzeni","y":"● Orbit"},{"c":"S16","n":"Araç Filosu ve Yakıt Kontrolü","s":"Yakıt tüketimi, kilometre, güzergâh ve görev uyumu; araç kullanım yetkileri; yakıt kartı istisnaları. Araç takip sistemi (B8) varsa verisiyle karşılaştırılır.","o":"filo analizi + kural önerisi","y":"● Orbit"}]},{"n":"Süreç, Yetki ve Saha Operasyonu","q":"Kim neyi, hangi yetkiyle yapıyor?","p":[{"c":"S17","n":"Yetki Matrisi Paketi","s":"Sistem ve fiziki yetkilerin haritası; görev ayrılığı çakışmaları; limitler ve kişiler bazında yeni yetki matrisi. İmza yetkileri S18'de ayrıca ele alınır.","o":"yetki matrisi + uygulama yazısı","y":"● Orbit"},{"c":"S18","n":"İmza Sirküsü ve İmza Yetki Modeli","s":"Kimin hangi belgede, hangi tutara kadar, tek başına veya birlikte imza atabileceği modellenir; ticaret sicilindeki imza sirküleri, banka imza yetkileri ve fiili uygulama karşılaştırılır. Sirküler değişikliği ve noter işlemleri avukat iş ortağıyla.","o":"imza yetki modeli + güncelleme listesi","y":"◐ Orbit + iş ortağı"},{"c":"S19","n":"Prosedür ve İş Tanımı Seti","s":"10 kritik süreç için prosedür, 10 pozisyon için görev ve iş tanımı.","o":"doküman seti","y":"● Orbit"},{"c":"S20","n":"Bayi, Şube ve Mağaza Saha Kontrolü","s":"Şube, bayi veya mağazalarda kasa, stok, fiyat, vitrin ve prosedür uyumunun sürpriz ziyaretle kontrolü.","o":"şube puan kartı + eylem listesi","y":"● Orbit"}]},{"n":"Sektörel Kontroller: Gıda","q":"Reçetem, firem ve kârlılığım doğru mu?","p":[{"c":"S21","n":"Gıda Reçete, Fire ve Kârlılık Kontrolü","s":"Ürün reçetelerinin doğruluğu, fiili tüketimle farkı, fire oranları ve ürün bazlı kârlılık kontrol edilir; zincirleşme yolundaki firmalar için reçete ve maliyet standardı oluşturulur.","o":"reçete-maliyet tablosu + fire ve kârlılık bulgu raporu","y":"◐ Orbit + iş ortağı"}]}]},{"k":"B","name":"BİLİŞİM","intro":"Yazılım ihtiyacını belirlemek, mevcut yazılımın yeterliliğini anlamak; yeterliyse entegre etmek, değilse özel yazılım geliştirmek. Verinin, sistemlerin ve iletişimin güvende olduğunu görünür kılmak. Karar akışı: İhtiyaç belirleme (B1) → mevcut yazılım incelemesi (B2) → ihtiyacı karşılıyorsa diğer ERP ve sistemlerle entegrasyon (B6); karşılamıyorsa özel yazılım (B7).","hats":[{"n":"Yazılım İhtiyacı ve Mevcut Sistem İncelemesi","q":"Kullandığım yazılımlar ihtiyacımı karşılıyor mu?","p":[{"c":"B1","n":"Yazılım İhtiyaçlarını Belirleme","s":"İş süreçleri, kullanıcılar ve veri akışları üzerinden yazılım ihtiyaçlarının çıkarılması ve önceliklendirilmesi.","o":"ihtiyaç belgesi + öncelik listesi","y":"● Orbit"},{"c":"B2","n":"Mevcut Yazılım İncelemesi ve Uygunluk Kararı","s":"Kullanımdaki yazılımlar incelenir, ihtiyacı karşılayıp karşılamadığı tespit edilir. Sonuç yönlendirir: karşılıyorsa B6, karşılamıyorsa B7.","o":"uygunluk raporu + karar notu","y":"● Orbit"},{"c":"B3","n":"ERP Öncesi Hazırlık","s":"İhtiyaç, süreç ve veri temizliği; aday çözümlerin kıyası; seçim kriterleri.","o":"gereksinim belgesi + kıyas","y":"● Orbit"}]},{"n":"ERP Sistemleri ve Entegrasyon","q":"Sistemlerim birbiriyle konuşuyor mu?","p":[{"c":"B4","n":"ERP Kurulum ve Devreye Alma Yönetimi","s":"Seçilen ERP sisteminin kurulum ve uyarlama sürecinin yönetimi, veri aktarımı, kullanıcı kabulü ve devreye alma.","o":"devreye alma planı + kabul kaydı","y":"● Orbit"},{"c":"B5","n":"Sistem Entegrasyon Haritası","s":"Sistemler arası veri akışı haritası; birbirine konuşmayan sistemler için entegrasyon tasarımı.","o":"harita + teknik şartname","y":"● Orbit"},{"c":"B6","n":"Mevcut Yazılımların ERP ve Diğer Sistemlerle Entegrasyonu","s":"İhtiyacı karşıladığı görülen yazılımların kullanılan ERP ve diğer sistemlerle bağlanması, test ve devreye alma.","o":"çalışan entegrasyon + test kaydı + kullanım notu","y":"● Orbit"}]},{"n":"Özel Yazılım Geliştirme","q":"Hazır yazılım ihtiyacımı karşılamıyorsa?","p":[{"c":"B7","n":"Özel Yazılım Geliştirme","s":"B2'de ihtiyacın karşılanmadığı görülen alanda analiz, tasarım, geliştirme, test ve devreye alma; mevcut sistemlerle entegrasyonu dahil.","o":"çalışan yazılım + dokümantasyon + kabul testi","y":"● Orbit"}]},{"n":"Araç Takip ve Saha Sistemleri","q":"Araçlarım nerede, nasıl kullanılıyor?","p":[{"c":"B8","n":"Araç Takip Sistemi Önerisi ve Devreye Alma","s":"İhtiyaca uygun araç takip sistemi önerilir ve devreye alınır: rotalar izlenir, güzergâh dışına çıkışlar anlaşılır, yakıt tüketimi incelenir, kesilen trafik cezalarının kime fatura edileceği kolayca belirlenir, hafta sonu ve mesai dışı kullanım gözlemlenir. Lojistik optimizasyonu (S15) ve araç filosu kontrolü (S16) bu veriye dayanır.","o":"sistem önerisi + kurulum + kullanım kuralları","y":"● Orbit"}]},{"n":"Dijitalleşme ve E-Dönüşüm","q":"Belge ve süreçlerim dijitalde düzgün akıyor mu?","p":[{"c":"B9","n":"E-Dönüşüm ve Belge Akışı Kontrolü","s":"E-fatura, e-irsaliye, e-arşiv ve e-defter süreçlerinin işletme içindeki akışı: kim, ne zaman, hangi sistemle; hata ve iptal yönetimi. Vergisel uygunluk görüşü içermez, SMMM iş ortağıyla.","o":"akış haritası + hata listesi","y":"◐ Orbit + iş ortağı"},{"c":"B10","n":"E-Fatura, E-Arşiv ve E-Dönüşüm Kurulum Organizasyonu","s":"E-fatura, e-arşiv (gerekirse e-irsaliye, e-defter) geçiş ve kurulumunun organize edilmesi: mevcut durum tespiti, entegratör ve yazılım seçeneklerinin kıyası, kurulum ve test takvimi, çalışan eğitimi, kullanıma geçiş takibi. Resmî başvuru ve vergisel uygunluk SMMM iş ortağıyla.","o":"geçiş planı + kurulum takibi + kullanım kılavuzu","y":"◐ Orbit + iş ortağı"},{"c":"B11","n":"Excel ve Kritik Tablo Riski Taraması","s":"Yönetim kararlarını besleyen kritik Excel dosyalarının envanteri: sahip, formül, bağlantı, yedek, değişiklik izi; kritik dosyaların güvenceye alınması.","o":"tablo envanteri + risk skoru + önlem listesi","y":"● Orbit"},{"c":"B12","n":"İş Akışı ve Onay Dijitalleştirme Sprinti","s":"Satın alma talebi (SAS: Satın Alma Sistemi), avans, masraf veya izin gibi bir sürecin hazır araçlarla form ve onay akışı olarak dijital kurulumu; limitler ve kişiler bazında yetki matrisine (S17) bağlanması.","o":"çalışan akış + kullanım kılavuzu","y":"● Orbit"}]},{"n":"Veri, İş Zekası ve BT Stratejisi","q":"Kararlarım veriye dayanıyor mu?","p":[{"c":"B13","n":"Veri Mimarisi ve Yönetişimi","s":"Büyük veri (Big Data), veri ambarı (DWH), ana veri yönetimi (MDM) ve veri kataloğu tasarımı.","o":"veri mimarisi + veri kataloğu + yönetişim kuralları","y":"● Orbit"},{"c":"B14","n":"İş Zekası ve Analitik Kurulumu","s":"İş süreçlerinde veri odaklı karar alma mekanizmalarının kurulması, BI sistemlerinin modellenmesi ve raporlanması.","o":"BI modeli + raporlar + gösterge sözlüğü","y":"● Orbit"},{"c":"B15","n":"Dijital Dönüşüm ve Süreç Optimizasyonu (BPR)","s":"Finansal teknolojiler dahil operasyonel süreçlerin dijitalleştirilmesi; iş süreçlerinin yeniden tasarımı (Business Process Reengineering).","o":"mevcut ve yeni süreç haritası + dönüşüm planı","y":"● Orbit"},{"c":"B16","n":"BT Stratejisi ve Ekip Kurgusu","s":"Büyük ölçekli analitik ve yazılım ekiplerinin (CRM, veri ambarı, iş zekası) kurulması ve yönetilmesi; BT stratejisi ve stratejik yol haritasının çıkarılması.","o":"BT stratejisi + ekip yapısı + yol haritası","y":"● Orbit"},{"c":"B17","n":"Veri Güvenliği ve Regülasyon Uyumu (DPO Desteği)","s":"Veri Koruma Yetkilisi (DPO) rolüyle veri güvenliği, gizlilik ve yasal raporlama standartlarına uyum. Hukuki yorum avukat iş ortağıyla; KVKK hazırlığı için G4.","o":"uyum planı + raporlama takvimi","y":"◐ Orbit + iş ortağı"}]},{"n":"Siber Güvenlik","q":"Verim ve iletişimim güvende mi?","p":[{"c":"B18","n":"Siber Hijyen Taraması","s":"Temel güvenlik taraması: güncellemeler, parola politikası, e-posta güvenliği, uç nokta durumu.","o":"tarama raporu + 30 maddelik düzeltme listesi","y":"◐ Orbit + iş ortağı"},{"c":"B19","n":"Yedekleme ve Geri Dönüş Testi","s":"Yedeklerin varlığı, konumu ve gerçekten geri dönülebildiğinin testi; veri merkezi konumu.","o":"test raporu","y":"◐ Orbit + iş ortağı"},{"c":"B20","n":"Oltalama (Phishing) Simülasyonu ve Farkındalık","s":"Çalışanlara kontrollü oltalama e-postası testi, sonuç raporu ve kısa eğitim; kimlerin hangi konuda tıkladığı. Yalnızca müşterinin yazılı izniyle.","o":"test sonucu + eğitim + tekrar testi","y":"◐ Orbit + iş ortağı"},{"c":"B21","n":"Teknik Koruma Taraması","s":"İş yeri, araç ve telefonlarda izinsiz dinleme, izleme, takip ve zararlı yazılım kontrolü; yalnızca müşterinin yetkili olduğu alanda, lisanslı iş ortağı eliyle.","o":"tarama tutanağı","y":"○ İş ortağı"},{"c":"B22","n":"Dijital Sahiplik, Şifre ve Erişim Yönetimi","s":"Şirketin dijital varlıklarının (alan adı, e-posta, bulut, sosyal medya, banka ve kurum giriş hesapları) envanteri; hangi şifrelerin kimde olduğunun tespiti; tüm şifrelerin yenilenmesi ve yetki matrisinin oluşturulması. Ayrılan personel prosedürüne (G9) bu adımın eklenmesi.","o":"dijital varlık envanteri + yeni şifre düzeni + erişim yetki matrisi","y":"● Orbit"}]}]},{"k":"G","name":"GÜVEN","intro":"Şirketin hukuki, insan, etik ve uyum risklerini görünür kılmak.","hats":[{"n":"Hukuki Yapı ve Uyum (hukuk ortağıyla)","q":"Sözleşme ve yapı boşluklarım neler?","p":[{"c":"G1","n":"Sözleşme Envanteri ve Risk İşaretleme","s":"Sözleşmelerin envanteri: süre, yenileme, tek taraflı ve açık maddelerin işaretlenmesi; sözleşmesiz yürüyen işler. Hukuki yorum yapılmaz, işaretli maddeler iş ortağı avukata iletilir.","o":"risk tablosu + öncelik listesi","y":"◐ Orbit + iş ortağı"},{"c":"G2","n":"Yönetim ve Karar Yapısı Haritası (Aile Şirketi)","s":"Ortaklık, yönetim ve karar süreçlerinin haritası; aile-şirket ayrımı; devir ve süreklilik senaryoları (yönetişim açısından). İmza yetkileri S18'de ele alınır; hukuki yapılandırma avukata aittir.","o":"yapı görüşü + öneri","y":"◐ Orbit + iş ortağı"},{"c":"G3","n":"Marka, Patent ve Fikri Mülkiyet Envanteri","s":"Marka, patent, faydalı model, tasarım ve alan adlarının envanteri: kayıtlı olduğu kişi veya kurum, koruma süresi ve yenileme tarihleri, kapsanan sınıf ve ülkeler, kullanılıp tescilsiz kalan işaretler. Başvuru ve hukuki değerlendirme marka ve patent vekili / avukat iş ortağından.","o":"envanter + yenileme takvimi + tescil boşlukları listesi","y":"◐ Orbit + iş ortağı"},{"c":"G4","n":"KVKK Hazırlık Paketi","s":"Veri envanteri, süreç haritası, saklama yeri ve erişim riskleri, VERBİS durumu kontrolü. Metinler ve hukuki görüş iş ortağı avukattan.","o":"envanter + eylem planı","y":"◐ Orbit + iş ortağı"},{"c":"G5","n":"Kişisel Veri İhlali Müdahale Planı","s":"Veri ihlalinde kim ne yapar: tespit, kayıt, yönetime bildirme, Kurul ve ilgili kişilere bildirim akışı, masa başı tatbikat. Bildirim yükümlülükleri güncel mevzuatla ve avukatla teyit edilir.","o":"müdahale planı + kart seti + tatbikat","y":"◐ Orbit + iş ortağı"}]},{"n":"İnsan Kaynakları ve Kritik Kişiler","q":"Kime, neye bağımlıyım?","p":[{"c":"G6","n":"İK Süreç ve Verimlilik İncelemesi","s":"İşe alım, izin, puantaj, performans, norm kadro ve personel devir hızı süreçlerinin doğru ve verimli yürüyüp yürümediği incelenir.","o":"bulgu raporu + iyileştirme listesi","y":"◐ Orbit + iş ortağı"},{"c":"G7","n":"Personel Süreç Kontrolü","s":"İşe giriş-çıkış, puantaj, yetki ve sorumluluk süreçlerinin kontrolü; uyuşmazlık ve grev riskinin süreç tarafı. Kartla giriş-çıkış varsa kartların kat ve bina erişim yetkileri sınırlandırılır. SGK ve puantaj yorumu İK/SMMM'ye, toplu iş ve grev değerlendirmesi avukata aittir.","o":"bulgu raporu","y":"◐ Orbit + iş ortağı"},{"c":"G8","n":"Kritik Kişi Bağımlılığı Ölçümü","s":"Kritik görev ve bilgilerin kişilere göre haritası; kayıp senaryosu; devir ve yedekleme planı.","o":"bağımlılık haritası + plan","y":"● Orbit"},{"c":"G9","n":"İşten Ayrılan Personel Çıkış Prosedürü","s":"Ayrılan her personel için tek bir çıkış prosedürü kurulur ve uygulanır. –  Mali durum: avans, kredi ve şirkete borç; eğitim bursu taahhüdü (süre dolmadan ayrılıyorsa eğitim tutarının rücusu); özel sağlık sigortası zeyili. –  Zimmet ve teslimler: araç, laptop, telefon, şirket hattı, telsiz, lojman (boşaltma), otopark aboneliği, kurumsal kart; iş yeri, ev, araç ve depo anahtarları; teslim edeceği projeler ve kritik bilgiler. –  Dijital ve resmî yetkiler: şirket adına sahip olduğu şifreler (banka, vergi dairesi, ticaret odası vb.); adına kayıtlı resmî yetkiler ve yönettiği kurum ilişkileri için yeni kişinin atama yazısıyla resmî kanallardan hemen düzeltme (örneğin İSG personeli); bina ve depo güvenlik sistemi şifrelerinin tamamen yenilenmesi ve telefonunun sistemden silinmesi (B22). –  İletişim: ayrılışın ve yeni iletişim kişisinin ilgili kurum ve karşı taraflara yazıyla bildirilmesi. –  Ek kalemler: e-posta ve bulut hesaplarının devri; imza ve banka yetkilerinin kapatılması (S18); müşteri/tedarikçi portalı ve sosyal medya yönetici yetkileri; gizlilik ve rekabet yasağı hatırlatması; kullanılmayan izin ve hak ediş mutabakatı.","o":"çıkış prosedürü + kontrol listesi + bilgilendirme yazısı şablonları","y":"◐ Orbit + iş ortağı"}]},{"n":"Etik ve İç Kontrol","q":"Sızıntı, çıkar çatışması veya rüşvet riski var mı?","p":[{"c":"G10","n":"Etik İhbar Hattı Kurulumu (isteğe bağlı)","s":"Çalışan ve tedarikçilerin gizli ihbar yapabileceği kanalın (telefon, e-posta, form) kurulması; ihbar alma, sınıflandırma ve yönetime bildirme prosedürü. İhbarın hukuki işlemi avukata; KVKK ek metni gerekir.","o":"hat + prosedür + yönetim bildirim akışı","y":"◐ Orbit + iş ortağı"},{"c":"G11","n":"Çıkar Çatışması ve İlişkili Taraf Beyan Sistemi","s":"Satın alma, satış ve finans çalışanları için yıllık beyan formu, tedarikçi eşleştirme kontrolü ve çatışma yönetim kuralları.","o":"beyan sistemi + ilk tarama raporu","y":"● Orbit"},{"c":"G12","n":"Rüşvet ve Yolsuzluk Önleme Sistemi Hazırlığı","s":"Politika, risk haritası, tedarikçi sözleşme maddesi önerileri ve eğitim; ISO 37001 benzeri yapıya boşluk analizi. Hediye ve ağırlama kuralları: alınabilecek hediyeler ile kurumun ilişkide olduğu kişilere verilebilecek hediyelerin listeleri ve tutar sınırları belirlenir; hediye verilmek istendiğinde yöneticiyi bilgilendirme ve onay sistemi mutlaka çalıştırılır. Sözleşme maddeleri avukattan.","o":"sistem dokümanları + hediye listeleri ve tutar tablosu + boşluk raporu","y":"◐ Orbit + iş ortağı"},{"c":"G13","n":"Tehdit ve Baskı Protokolü","s":"Tehdit veya baskı durumunda yapılacaklar: kayıt, delil, hukuki ve kolluk yönlendirmesi, kriz iletişimi. Operasyonel koruma hizmeti değildir.","o":"protokol + iletişim listesi","y":"◐ Orbit + iş ortağı"},{"c":"G14","n":"Olay İnceleme Desteği","s":"Para, mal veya veri kaybı şüphesinde olay zaman çizelgesi, kayıt ve erişim izleri, mal-para hareket analizi, bulguların yönetime sunulması. Bilirkişi raporu veya hukuki delil üretmez; delil bütünlüğü için avukat yönlendirmesi esastır.","o":"olay özeti + bulgu dosyası + sonraki adım önerisi","y":"◐ Orbit + iş ortağı"}]},{"n":"Mevzuat, Sertifika ve İklim Uyumu","q":"Mevzuat ve alıcı talepleri hazır mı?","p":[{"c":"G15","n":"Mevzuat ve Uyum Radarı","s":"Sektöre özel yasaklar, düzenleyici kurum (ör. EPDK) uyumu, emisyon ve çevre yükümlülükleri; yaklaşan değişiklikler. Hukuki yorum avukata aittir.","o":"uyum tablosu + izleme planı","y":"◐ Orbit + iş ortağı"},{"c":"G16","n":"Sertifikasyon Hazırlığı","s":"ISO 9001 / 14001 / 45001 / 22301 / 27001 için boşluk analizi ve hazırlık yol haritası. Belgelendirme akredite kuruluşça verilir.","o":"boşluk raporu + yol haritası","y":"◐ Orbit + iş ortağı"},{"c":"G17","n":"CBAM ve Karbon Veri Hazırlığı","s":"AB'ye ihracat yapan ve kapsama giren ürünlerde (demir-çelik, alüminyum, çimento, gübre vb.) ürün bazlı emisyon verisinin toplanması, tedarikçiden veri talep şablonu, alıcıya yanıt dosyası. Resmî doğrulama akredite doğrulayıcı kuruluşça.","o":"veri seti + tedarikçi şablonu + alıcı yanıt dosyası","y":"◐ Orbit + iş ortağı"},{"c":"G18","n":"Karbon Ayak İzi Ön Hesabı","s":"Kapsam 1 ve 2 emisyonları için veri toplama ve hesaplama; azaltım fırsatları listesi; ISO 14064 yaklaşımına uyumlu raporlama taslağı. Doğrulama akredite kuruluşça.","o":"ön hesap + azaltım listesi","y":"◐ Orbit + iş ortağı"}]}]},{"k":"F","name":"FİZİKSEL RİSKLER","intro":"Afet, kesinti, tedarik ve sigorta riskine karşı işin ayakta kalmasını sağlamak.","hats":[{"n":"Fiziksel Risk ve Afet","q":"Yangın, deprem, sel olursa?","p":[{"c":"F1","n":"Yangın ve Fiziksel Risk Saha İncelemesi","s":"Tesis, depo ve ofis yerinde incelenir: yangın yükü, tahliye, tesisat, ekipman, kaynak kontrolü.","o":"saha raporu + fotoğraflı eylem listesi","y":"● Orbit"},{"c":"F2","n":"Deprem Hazırlık Ön Değerlendirmesi","s":"Lokasyon, yapı bilgisi ve ekipman sabitleme; deprem sonrası ilk 72 saat planı. Yapısal güvenlik ve deprem risk tespiti yetkili/lisanslı kuruluşa aittir.","o":"hazırlık raporu","y":"◐ Orbit + iş ortağı"},{"c":"F3","n":"Acil Durum Tatbikatı","s":"Masa başı (yarım gün) ve saha tatbikatı; senaryo, gözlem, değerlendirme.","o":"tatbikat raporu","y":"● Orbit"},{"c":"F4","n":"İlk 72 Saat Kiti","s":"Afet veya büyük kesinti sonrası ilk 72 saat için iletişim zinciri, rol kartları, kritik telefon ve dosya listesi, tahliye ve toplanma bilgisi; basılı ve dijital kart seti.","o":"kart seti + iletişim ağacı","y":"● Orbit"},{"c":"F5","n":"İSG ve SEÇ Sistem Kontrolü","s":"İş kazası kayıtları, risk değerlendirmesi, eğitim ve ekipman uygunluğu, mevzuat boşlukları. Resmî İSG hizmeti yetkili OSGB / iş güvenliği uzmanı eliyle; Orbit sistem ve kayıt kontrolü yapar.","o":"uygunluk raporu","y":"◐ Orbit + iş ortağı"}]},{"n":"Kesinti ve Tedarik Riski","q":"Üretim, tedarik veya altyapı durursa?","p":[{"c":"F6","n":"İş Etki Analizi (BIA)","s":"Kritik süreçler, kesinti maliyeti, en çok dayanılabilir kesinti süresi (RTO), veri kaybı toleransı (RPO).","o":"BIA raporu + öncelik matrisi","y":"● Orbit"},{"c":"F7","n":"İş Sürekliliği Planı","s":"BIA'ya dayalı plan: alternatif üretim/çalışma yeri, rol dağılımı, iletişim zinciri, devreye alma adımları.","o":"süreklilik planı + kısa kullanım kartları","y":"● Orbit"},{"c":"F8","n":"Altyapı Kesinti Haritası","s":"Elektrik, su, doğalgaz, internet ve haberleşme kesintilerinde etki ve yedek çözüm; hat tekliği.","o":"kesinti haritası + yedek çözüm listesi","y":"● Orbit"},{"c":"F9","n":"Tedarik Zinciri Kırılganlık Haritası","s":"Tek kaynak, ithal bağımlılık, lojistik rota ve stok yeterliliği; yedek tedarikçi planı.","o":"harita + yedek plan","y":"● Orbit"},{"c":"F10","n":"Veri Merkezi Konum Riski","s":"Sunucu/bulut konumu, fay hattı ve afet kaynaklı birlikte kayıp riski, KVKK'ya göre yurt içi/dışı saklama görüşü (iş ortağı avukatla).","o":"konum risk notu","y":"◐ Orbit + iş ortağı"},{"c":"F11","n":"Kritik Ekipman ve Yedek Parça Haritası","s":"Durması işi durduracak ekipmanın, yedek parça stoğunun ve tedarik süresinin haritası; bakım ve yedek planı.","o":"ekipman matrisi + yedek parça planı","y":"● Orbit"},{"c":"F12","n":"Biyogüvenlik ve Salgın Hazırlığı (Hayvan, Bitki, Gıda)","s":"Canlı hayvan, bitki veya gıda üretiminde salgın, hastalık ve soğuk zincir riski için süreç, giriş-çıkış kontrolü, karantina ve acil durum planı. Veteriner ve ziraat mühendisi görüşü uzman iş ortağından.","o":"risk haritası + biyogüvenlik prosedürü","y":"◐ Orbit + iş ortağı"},{"c":"F13","n":"Ürün Geri Çağırma Hazırlığı","s":"Üretilen mal birine zarar verirse: izlenebilirlik, parti kaydı, geri çağırma akışı, iletişim ve sigorta bildirimi; masa başı tatbikat. Sigorta bildirimi sigorta iş ortağıyla, hukuki sorumluluk avukattan.","o":"geri çağırma planı + tatbikat","y":"◐ Orbit + iş ortağı"},{"c":"F14","n":"Elektrik ve Enerji Görünürlük Kontrolü","s":"Elektrik faturası, çekiş, kesinti kayıtları ve reaktif ceza kalemlerinin kontrolü; kesintide kritik yük listesi. Resmî enerji etüdü değildir.","o":"enerji görünürlük raporu + kritik yük listesi","y":"◐ Orbit + iş ortağı"}]},{"n":"Sigorta Yeterliliği","q":"Sigortam riskimi gerçekten karşılıyor mu?","p":[{"c":"F15","n":"Sigorta Teminat Envanteri ve Boşluk Listesi","s":"Poliçelerin teminat, istisna, değer ve limitlerinin süreklilik senaryolarıyla eşleştirilmesi; sigortacıya sorulacak soruların listesi.","o":"poliçe karşılaştırma + boşluk listesi","y":"◐ Orbit + iş ortağı"}]}]},{"k":"Y","name":"YÖNETİM","intro":"Diğer beş kümenin üzerinde duran görünürlük ve düzen katmanı.","hats":[{"n":"Check-up, Panel ve Eğitim","q":"Şirketim şu anda nerede?","p":[{"c":"Y1","n":"İşletme Check-up (Hızlı / Plus)","s":"Hızlı: çevrimiçi soru formu + otomatik özet. Plus: yönetim görüşmesi, belge örneklemi, kümeler bazında puanlı rapor ve ilk 10 eylem.","o":"Hızlı: özet skor. Plus: 15 sayfalık rapor","y":"● Orbit"},{"c":"Y2","n":"Yönetim Paneli Kurulumu","s":"Sahibin 12 göstergesi: nakit, alacak, borç, kârlılık, risk, aksiyon; veri kaynaklarının bağlanması (veri ve BI tarafı B14 ile birlikte).","o":"panel + gösterge sözlüğü","y":"● Orbit"},{"c":"Y3","n":"Patron için Kontrol Atölyesi","s":"Yarım günlük atölye: hangi raporlar, hangi sorular, hangi kontroller.","o":"atölye kiti","y":"● Orbit"},{"c":"Y4","n":"Yönetim Ritmi Kurulumu","s":"Haftalık ve aylık yönetim toplantısı düzeni, gösterge sözlüğü, aksiyon takibi ve sorumlu atama; ilk üç ay toplantıya eşlik.","o":"toplantı düzeni + gösterge sözlüğü + 3 ay eşlik","y":"● Orbit"},{"c":"Y5","n":"Kurum İçi Eğitim Günleri","s":"Yöneticiler ve ekipler için: hile ve sızıntı farkındalığı, tahsilat disiplini, acil durum ve tahliye, yönetim raporu okuma. Yarım veya tam gün.","o":"eğitim + katılım kaydı + kısa test","y":"● Orbit"}]},{"n":"Sürekli Kontrol","q":"Kurulan sistem çalışmaya devam ediyor mu?","p":[{"c":"Y6","n":"Aylık Kontrol Aboneliği (Orbit Gözcü)","s":"Her ay: gösterge takibi, rastgele örneklem testleri, risk güncellemesi, aksiyon takibi, 1 saat yönetim toplantısı.","o":"aylık rapor + toplantı","y":"● Orbit"},{"c":"Y7","n":"Orbit Masası (Danışma Kurulu)","s":"Üç aylık danışma kurulu toplantısı: finans, hukuk, süreklilik uzmanlarıyla yönetim masası.","o":"toplantı notu + karar listesi","y":"● Orbit"},{"c":"Y8","n":"Kurumsal Üyelik (yıllık)","s":"Gözcü aboneliği + Masa + öncelikli paket erişimi + acil durum danışma hattı.","o":"yıllık sözleşme","y":"● Orbit"},{"c":"Y9","n":"Dış Kaynak Finans Yönetimi (Kısmi Zamanlı Finans Direktörü)","s":"Ayda belirli gün: nakit ve bütçe takibi, banka ilişkisi, yönetim raporu, finans ekibine yönlendirme. Muhasebe işlemi yapmaz; mali müşavirlik veya muhasebe hizmeti değildir.","o":"aylık finans toplantısı + rapor","y":"● Orbit"}]},{"n":"Büyüme, Devir ve Birleşme","q":"Büyürken, devrederken ya da birleşirken hazır mıyım?","p":[{"c":"Y10","n":"Büyük Müşteri / Tedarikçi Bağımlılık Analizi","s":"Ciro ve marjın müşteri/tedarikçiye göre yoğunlaşması; kayıp senaryosu ve yedek plan.","o":"bağımlılık raporu + plan","y":"● Orbit"},{"c":"Y11","n":"Ürün, Pazar ve Teknoloji Eskime Görüşü","s":"Büyük yatırım yapılmış ürün veya teknolojinin gelecek riski; pazar ve düzenleme senaryoları.","o":"görüş notu","y":"● Orbit"},{"c":"Y12","n":"Aile ve Şirket Süreklilik Haritası","s":"Karar, yetki ve devir senaryolarının yönetişim açısından haritası. Yatırım tavsiyesi, hukuki yapılandırma ve vergi görüşü içermez; bunlar avukat ve SMMM/YMM iş ortaklarına aittir.","o":"görüş notu","y":"◐ Orbit + iş ortağı"},{"c":"Y13","n":"Kurumsal Alıcı ve İhracat Hazırlık Dosyası","s":"AB'li veya büyük kurumsal alıcıların tedarikçi anketleri için kalite, siber, çevre, çalışma koşulları ve etik başlıklarında kanıt dosyası ve yanıt şablonları. Sözleşme ve hukuki yanıtlar avukattan.","o":"hazırlık dosyası + yanıt şablonları","y":"◐ Orbit + iş ortağı"},{"c":"Y14","n":"Satışa ve Ortaklığa Hazır Olma Kontrolü","s":"Şirket satışı, yeni ortak veya yatırım öncesi finansal ve operasyonel veri odası düzeni, tutarsızlık taraması, soru-cevap hazırlığı. Değerleme ve hukuki inceleme içermez.","o":"hazırlık raporu + veri odası yapısı","y":"◐ Orbit + iş ortağı"},{"c":"Y15","n":"Görev Devri ve Yönetici Geçiş Programı","s":"Kilit kişi ayrılması veya yeni yönetici gelişi için görev ve bilgi envanteri, 30-60-90 gün devir planı, yedek atama.","o":"devir planı + bilgi envanteri","y":"● Orbit"},{"c":"Y16","n":"Birleşme Öncesi Mali Durum Tespiti","s":"Birleşme veya devralma öncesi tarafların mali tablolarının ve mizanlarının karşılaştırılabilir hale getirilmesi, muhasebe politikası farkları, borç-alacak ve teminat yapısı, kritik sözleşme ve yetkilerin ön haritası, süreç takvimi. Bağımsız denetim, değerleme, hukuki ve vergisel inceleme içermez; bunlar yetkili iş ortaklarına aittir.","o":"mali durum tespit notu + açık konular listesi + süreç planı","y":"◐ Orbit + iş ortağı"},{"c":"Y17","n":"Birleşme Sonrası Entegrasyon Programı","s":"Birleşmenin ardından hesap planı ve muhasebe politikası birleştirme, ERP ve sistem entegrasyonu (B3--B6), yetki ve imza yapısının yeniden kurulması (S17, S18), yönetim raporlama setinin birleştirilmesi, ilk 100 gün takibi.","o":"entegrasyon planı + takip raporu","y":"● Orbit"}]}]}];window.OFD=[{"c":"O1","n":"Teklif Hazırlama Hizmeti","u":"teklif","t":[10,25,50,100],"k":"Satış odaklı, yalnız çalışan; teklif hazırlamayı bilmeyen veya zaman ayıramayanlar","o":"PDF ve düzenlenebilir Word / Excel teklif; aynı müşteriye revizyon hakkı","l":"Fiyatı ve ticari koşulları müşteri onaylar; hukuki sözleşme metni hazırlanmaz. Teklif başına 2 revizyon dahildir.","d":"teklif başına 1 iş günü (acele teslim seçeneği)","b":"talep bilgisi (e-posta, not veya ses kaydı), fiyat listesi veya maliyet, logo ve şablon tercihi"},{"c":"O2","n":"Fiyat Listesi Hazırlama","u":"kalem","t":[25,100,250,500],"k":"Fiyat listesi olmayan veya düzenli tutamayan işletmeler","o":"Logolu, düzenli fiyat listesi (PDF ve Excel): kalem, birim, KDV hariç / dahil fiyat, geçerlilik tarihi; müşterinin verdiği maliyet ve kâr oranından hesaplanmış satış fiyatı","l":"Fiyatı ve kâr oranını müşteri belirler; piyasa araştırması yapılmaz (Ürün Araştırma Hizmeti ve Pazarı Derinlemesine İnceleme ayrı hizmetlerdir).","d":"25 kaleme kadar 1 iş günü","b":"kalem listesi, maliyet veya mevcut fiyat, kâr oranı, logo"},{"c":"O17","n":"Sunum (PowerPoint) Hazırlama Hizmeti","u":"slayt","t":[10,20,40,80],"k":"Yatırımcı, müşteri veya yönetim sunumunu hazırlamaya zamanı ya da tasarım becerisi olmayanlar","o":"Düzenlenebilir PowerPoint (.pptx) dosyası ve PDF: sade slayt yapısı, logo ve renklerinize uygun şablon, grafik ve tablolar; 2 revizyon dahil","l":"İçerik ve rakamların doğruluğu sizin sorumluluğunuzdadır; araştırma, metin yazarlığı, özel illüstrasyon ve animasyon kapsam dışıdır. Sunumu sizin adınıza yapmayız","d":"10 slayt için 2 iş günü; daha uzun sunumlar kademeli (acele teslim seçeneği)","b":"Taslak metin veya notlar (e-posta, Word veya ses kaydı), varsa logo, kurumsal renkler, mevcut şablon ve örnek sunumlar; sunumun amacı ve dinleyicisi"},{"c":"O3","n":"Ürün Araştırma Hizmeti","u":"ürün kalemi","t":[1,10,50,100],"k":"Satın alma yapması gereken, konuda deneyimi olmayan işletmeler","o":"Karşılaştırma tablosu, en az 5 aday üretici / distribütör listesi, fiyat araştırma tablosu (liste ve alınan teklifler), risk ve uygunluk notu, 1–2 sayfalık öneri","l":"Satın alma kararı müşterinindir. Laboratuvar testi yapılmaz; bağımsız test ve belge verileri kaynak gösterilerek derlenir.","d":"kalem başına 3–5 iş günü; çok kalemde paralel","b":"kullanım amacı, bütçe aralığı, adet, teslim yeri ve zamanı, varsa mevcut tedarikçi"},{"c":"O4","n":"Pazarı Derinlemesine İnceleme","u":"ürün","t":[1,2,5,10,20],"k":"Bir ürünü satın almadan önce pazarın tamamını görmek, doğru üreticiye ve en uygun fiyata ulaşmak isteyen işletmeler","o":"Ürünün üreticilerinin büyük çoğunluğuna ve distribütörlerine ulaşılması; yurt dışından alınabiliyorsa yabancı üretici veya tedarikçiyle doğrudan iletişim kurulması; fiyat, teslim süresi, minimum sipariş, garanti ve ödeme koşullarının karşılaştırma tablosu; yurt içi ve ithalat seçeneklerinin kıyası; kısa öneri notu","l":"Satın alma kararı müşterinindir.","d":"1 ürün için 5–7 iş günü; yurt dışı yazışmaları olan ürünlerde süre karşı tarafın yanıt hızına bağlıdır","b":"ürün adı ve teknik özellikleri, adet ve kullanım amacı, teslim yeri ve zamanı, bütçe aralığı, varsa mevcut tedarikçi ve fiyatı"},{"c":"O6","n":"Ödeme Hatırlatma Hizmeti","u":"arama","t":[10,50,100,500],"k":"Alacaklarını takip edecek zamanı veya ekibi olmayanlar","o":"Arama sonuç tablosu: ulaşıldı / ulaşılamadı, söz verilen ödeme tarihi, itiraz nedeni, sonraki adım; haftalık özet","l":"Arama = bir muhatap için tamamlanan görüşme veya en çok 3 deneme. Tehdit, baskı veya yanıltıcı ifade kullanılmaz; yalnızca ticari alacak; hukuki takip yapılmaz, avukata yönlendirilir. Görüşme kaydı izinle.","d":"listeyi aldıktan sonra 2 iş günü içinde başlar","b":"alacak listesi (müşteri, tutar, vade), yetkili kişi ve telefon, ödeme ve itiraz bilgilendirme notu"},{"c":"O7","n":"Mutabakat Arama Hizmeti","u":"arama","t":[20,100,500,1000],"k":"Cari hesap bakiyelerini karşı tarafla teyit etmek isteyenler","o":"Mutabakat tablosu: mutabık / fark var / ulaşılamadı; fark nedeni ve düzeltme önerisi","l":"Hukuki mutabakat belgesi yerine geçmez; resmî mutabakat yazısı müşterinin imzasıyla gider.","d":"listeyi aldıktan sonra 3 iş günü içinde başlar","b":"cari bakiye listesi (karşı taraf, bakiye, tarih), muhatap iletişim bilgileri"},{"c":"O9","n":"Ticari Karşı Taraf Ön Tarama (Açık Kaynaklardan)","u":"firma","t":[1,2,5,10],"k":"Yeni bir müşteri veya tedarikçiyle çalışmadan önce firmayı açık kaynaklardan incelemek isteyenler","o":"Açık kaynaklardan firma incelemesi: ünvan, vergi no, ticaret sicil ve ilan kayıtları, ortaklık ve faaliyet bilgisi, e-fatura durumu, internet ve basında yer alan bilgiler; teyit tablosu ve uyumsuzluk işaretleri","l":"Yalnızca açık (kamuya açık) kaynaklardan çalışılır; kredi notu veya istihbarat raporu değildir. Kişisel veri asgari tutulur.","d":"firma başına 1 iş günü","b":"firma ünvanı, vergi numarası veya telefon"},{"c":"O10","n":"Alacak Dosyası Derleme","u":"dosya","t":[1,5,10],"k":"Geciken alacağı avukata veya takibe taşımak isteyenler","o":"Fatura, irsaliye, sipariş ve yazışmaların tek dosyada tarih sırasıyla derlenmesi; özet sayfa","l":"Hukuki takip yapılmaz; avukata devir evrakları hazırlanır ve firmanın kendi sözleşmeli avukatına sunulur.","d":"dosya başına 2 iş günü","b":"fatura, irsaliye, sipariş ve yazışma dosyaları"},{"c":"O22","n":"Dernek Kuruluş Paketi","u":"dernek","t":[1],"k":"Dernek kurmak isteyen ve kuruluşu baştan doğru, eksiksiz yapmak isteyen kurucular","o":"Tüzük taslağı; kurucu üye ve organ yapısı; kuruluş bildirimi ve eklerinin hazırlanması; kuruluş başvurusunun yapılması ve takibi; ilk yönetim kurulu kararları; defter ve kayıt düzeni; imza sirküsü hazırlığı","l":"Kuruluş başvurusu kurucuların imzasıyla yapılır.","d":"Kurucu bilgileri tamamlandıktan sonra 5 iş günü","b":"derneğin amacı ve faaliyet alanı, kurucu üyelerin bilgileri, merkez adresi, varsa örnek aldığınız dernek tüzükleri"},{"c":"O23","n":"Dernek İdari Yapılanma Paketi","u":"dernek","t":[1],"k":"Kurulmuş ama idari yapısı oturmamış, işleri kişilere bağlı yürüyen dernekler","o":"Mevcut tüzüğün gözden geçirilmesi ve tüzük düzenlemesi (değişiklik taslağı); idari şema (organizasyon yapısı); görev tanımları; imza yetkileri modeli ve imza sirküsü düzeni; karar, yazışma ve arşiv düzeni; yönetim kurulu toplantı ve genel kurul takvimi","l":"Tüzük değişikliği genel kurul kararıyla yürürlüğe girer.","d":"Belgeler geldikten sonra 7–10 iş günü","b":"tüzük, son genel kurul ve yönetim kurulu kararları, mevcut görev dağılımı, varsa imza sirküsü ve yönetmelikler"},{"c":"O24","n":"Dernek İç Yönetmelik Hazırlama","u":"yönetmelik","t":[1,3,5,10],"k":"İç yönetmeliği olmayan veya mevcut yönetmeliklerini güncellemek isteyen dernekler","o":"Derneğinize özel iç yönetmelik taslağı: üyelik, mali işler ve harcama yetkileri, satın alma, personel ve gönüllü, şube ve temsilcilik, disiplin, eğitim ve tatbikat gibi konular; tüzükle uyum kontrolü; yönetim kurulu karar taslağı","l":"Yönetmelikler yönetim kurulu veya genel kurul kararıyla yürürlüğe girer.","d":"Yönetmelik başına 3–5 iş günü","b":"tüzük, ihtiyaç duyulan yönetmelik konuları, varsa mevcut yönetmelik ve uygulama örnekleri"},{"c":"O21","n":"Kredi Dosyası Hazırlama (Mizan Bazlı)","u":"dosya","t":[1,2,5,10],"k":"Banka kredisi başvurusu yapacak ve bankanın istediği tablo, hesaplama ve dosyayı hazırlamak isteyen işletmeler; inşaat gibi projelerde tamamlanma yüzdesini belgelemesi gerekenler","o":"Mizandaki verilerle bankanın istediği tablo ve hesaplamaların hazırlanması (ör. özet bilanço ve gelir tablosu, oran hesapları, borç ve teminat özeti); inşaat işlerinde mizandaki maliyetlerden iş tamamlanma yüzdesinin hesaplanması, dayanak tabloları ve evrak setinin hazırlanması; bankaya sunuma hazır dosya","l":"Dosya mizanınıza ve verdiğiniz bilgilere dayanır; doğruluk sizin sorumluluğunuzdadır. Bağımsız denetim, tasdik veya SMMM / YMM onayı gerektiren belgeler iş ortağı SMMM / YMM tarafından kendi sözleşmesiyle düzenlenir. Kredi onayı garanti edilmez; kredi aracılığı yapılmaz","d":"Eksiksiz mizanla 3–5 iş günü; inşaat tamamlanma hesabı proje verilerine göre değişir","b":"Güncel mizan, bilanço ve gelir tablosu, bankanın istediği evrak listesi, varsa proje bütçesi ve maliyet kalemleri (inşaat için), sözleşmeler ve hakediş bilgileri"},{"c":"O11","n":"Belge Dijitalleştirme ve Liste Hazırlığı","u":"belge","t":[100,500,1000,3000],"k":"Fişlerini ve faturalarını muhasebecisine düzenli ve takip edilebilir götürmek isteyenler","o":"Muhasebeye uygun Excel listesi: sıra no, tarih, belge türü, belge no, düzenleyen ünvan, vergi no, matrah, KDV oranı ve tutarı, toplam, ödeme şekli, açıklama; okunamayan belgelerin ayrı listesi","l":"Resmî muhasebe kaydı veya beyanname değildir; hesap kodu atanmaz. Asıl belgeler müşteride saklanır. Okunamayan belge işlenmez, listede işaretlenir. Liste müşterinin SMMM'sine gider.","d":"100 belgeye kadar 2 iş günü, sonrası kademeli","b":"okunaklı belge fotoğrafı, sıra numarası aralığı, muhasebecinin Excel desen tercihi"},{"c":"O12","n":"Banka Hareketi Eşleştirme Hazırlığı","u":"hareket","t":[250,1000,3000,10000],"k":"Banka ekstresi ile cariyi eşleştirmekte zorlananlar","o":"Ekstre satırlarının cari / belge ile eşleştirilmiş Excel listesi; eşleşmeyenlerin ayrı listesi","l":"Muhasebe kaydı değildir; liste müşterinin SMMM'sine gider.","d":"1.000 harekete kadar 2 iş günü","b":"banka ekstresi (Excel veya PDF), cari liste"},{"c":"O13","n":"Belge Tarama ve Klasörleme","u":"dosya","t":[100,200,500,1000],"k":"Arşivi dağınık olan, belgeleri düzenlemek isteyenler","o":"Klasörleme sisteminin kurulması (fiyata dahildir); belgelerin taranması, dosya adıyla adlandırılması ve klasörlere yerleştirilmesi; basit arama listesi","l":"Asıl belgeler müşteride kalır.","d":"100 dosyaya kadar 3 iş günü, sonrası kademeli","b":"belge paketi veya fotoğraflar"},{"c":"O14","n":"Sözleşme ve Vade Takip Tablosu","u":"sözleşme","t":[10,25,50,100],"k":"Sözleşmeleri dağınık olan ve süre kaçıranlar","o":"Taranmış sözleşmelerden taraf, tarih, süre, yenileme, fesih bildirim süresi ve tutar tablosu; yaklaşan tarih uyarı listesi","l":"Hukuki yorum yapılmaz; gerekirse avukata yönlendirilir.","d":"10 sözleşmeye kadar 3 iş günü","b":"taranmış sözleşmeler"},{"c":"O15","n":"Sayım Doğrulama ve Fark Tespiti","u":"gün (2 kişi)","t":[1,3,5,10],"k":"Yıl sonu veya sürpriz sayım yapan ve sayımın doğruluğunu bağımsız bir gözle teyit ettirmek isteyenler","o":"Sayımı sizin ekibiniz yapar; biz iki kişilik ekiple sayımın doğruluğunu yerinde teyit ederiz. Fiili (sayılan) ve kaydi (sistemdeki) stok arasındaki farkları ortaya koyar, fark tablosunu ve kısa bulgu notunu teslim ederiz","l":"Sayım sorumlusu ve sayım ekibi müşteri tarafından belirlenir.","d":"randevu ile gün bazında","b":"ürün veya sayım listesi, sistemdeki stok kayıtları, depo erişimi, sayım sorumlusu","nt":"İstanbul dışındaki çalışmalarda ekstra harcırah alınır."},{"c":"O16","n":"Aylık Yön
