sts, phishing simulations, technical-protection coordination, digital ownership and access management.": "Магистратура METU; специалист по киберпреступлениям. Проводит проверки кибергигиены, тесты восстановления, симуляции фишинга, координирует технические проверки защиты, управление цифровыми активами и доступом.", "Partners whose professional advice we draw on where their expertise is needed. They carry out regulated or licensed work under their own contracts and responsibility.": "Партнёры, к чьим профессиональным консультациям мы обращаемся там, где нужна их экспертиза. Регулируемые и лицензируемые работы они выполняют по собственным договорам и под свою ответственность.", "Legal opinions, contract and text drafting, KVKK texts, post-incident legal process; trademark and patent attorneys for IP.": "Юридические заключения, договоры и тексты, тексты по KVKK, правовые действия после инцидентов; патентные поверенные по ИС.", "Tax advice, filings, books, certification, transfer pricing, incentive-document approval.": "Налоговые консультации, декларации, учёт, заверение, трансфертное ценообразование, подтверждение документов по льготам.", "Insurance Agent / Broker": "Страховой агент / брокер", "Coverage advice, quote gathering, policy placement, claims process.": "Подбор покрытия, сбор предложений, размещение полисов, урегулирование убытков.", "OHS Provider": "Служба охраны труда", "Official OHS service, signed risk assessment, workplace physician, training.": "Официальная служба охраны труда, подписанная оценка рисков, врач предприятия, обучение.", "Quality Systems & QESH": "Системы качества и ОТ/ПБ/ООС", "OHS system checks, ISO certification readiness, environment and carbon data, procedure documentation.": "Проверка систем охраны труда, подготовка к ISO, экологические и углеродные данные, документирование процедур.", "IT Partner": "ИТ-партнёр", "Extra capacity for development, integration and infrastructure.": "Дополнительные ресурсы для разработки, интеграции и инфраструктуры.", "Data architecture and governance, BI and analytics, process redesign, IT strategy and team design, data-protection officer (DPO) support.": "Архитектура и управление данными, BI и аналитика, перестройка процессов, ИТ-стратегия и построение команды, поддержка ответственного за защиту данных (DPO).", "Licensed Cybersecurity": "Лицензированная кибербезопасность", "Vulnerability scans, penetration tests, technical execution of restore tests.": "Сканирование уязвимостей, пентесты, техническое проведение тестов восстановления.", "Technical Protection (licensed)": "Техническая защита (лицензированная)", "Eavesdropping, tracking-device and malware sweeps.": "Проверка на прослушку, трекеры и вредоносное ПО.", "Grants & Support": "Гранты и поддержка", "Screening grant, support and incentive programmes, preparing the application file and following the process.": "Поиск грантовых программ, программ поддержки и льгот, подготовка заявки и сопровождение процесса.", "Corporate Identity Design": "Разработка фирменного стиля", "Logo, colour and type system, letterhead, business cards, presentation and document templates; brand guidelines.": "Логотип, цветовая и шрифтовая система, бланки, визитки, шаблоны презентаций и документов; брендбук.", "Property & Land Collateral Appraisal": "Оценка залогов: недвижимость и земля", "Appraisal of property and land collateral by licensed valuers; current value report.": "Оценка залогов в виде недвижимости и земли лицензированными оценщиками; отчёт о текущей стоимости.", "Food: Recipe, Waste & Cost": "Общепит: рецептуры, потери и себестоимость", "Food recipe, waste and profitability control; standardisation for food businesses heading toward chains.": "Контроль рецептур, потерь и рентабельности; стандартизация для заведений, движущихся к сети.", "Accredited & Licensed Bodies": "Аккредитованные и лицензированные организации", "Emissions verification, ISO certification, measurement, official energy audits.": "Верификация выбросов, сертификация ISO, измерения, официальный энергоаудит.", "Other": "Другое", "Project-based work on varied topics such as engineering-heavy special subjects and Human Resources.": "Проектная работа по разным темам: специальные инженерные вопросы, управление персоналом.", "Our working principles": "Наши принципы работы", "Every project has one lead (project manager) and one second reviewer.": "В каждом проекте есть ответственный (руководитель проекта) и второй проверяющий.", "On topics that need specialist knowledge, a team works under the specialist’s supervision.": "В вопросах, требующих специальных знаний, команда работает под контролем специалиста.", "Each expert works in their own field: a software lead on software jobs, a cybersecurity lead on cybersecurity jobs.": "Каждый эксперт работает в своей области: ПО ведёт специалист по ПО, кибербезопасность — специалист по кибербезопасности.", "Partners declare any conflict of interest; experts give no opinions outside their remit and refer to a partner.": "Партнёры сообщают о конфликте интересов; эксперты не дают заключений вне своей компетенции и направляют к партнёру.", "Reach us quickly on WhatsApp, Telegram or WeChat.": "Свяжитесь с нами в WhatsApp, Telegram или WeChat.", "On WeChat you can find us with the number 0 532 598 97 04.": "В WeChat нас можно найти по номеру 0 532 598 97 04.", "Email": "E-mail", "Address": "Адрес", "Hello, I’d like some information.": "Здравствуйте, я хотел(а) бы получить информацию.", "Not cold reports, but solutions that touch your work right away. We’re an approachable team that stands beside growing businesses so they keep control as they grow.": "Не холодные отчёты, а решения, которые сразу влияют на вашу работу. Мы открытая команда, которая помогает растущим компаниям сохранять контроль.", "Who are we?": "Кто мы?", "Orbit Kontrol is a team that treats the money, operations, IT, trust and physical risks of growing SMEs and family companies as one business system: it designs the system, sets it up and monitors that it works. System design sits at the centre, with specialists from different disciplines around it.": "Orbit Kontrol — команда, которая рассматривает деньги, операции, ИТ, доверие и физические риски растущих МСП и семейных компаний как единую систему: проектирует её, внедряет и следит за её работой. В центре — проектирование систем, вокруг — специалисты разных дисциплин.", "Our starting point: sustainability": "Наша отправная точка: устойчивость", "A business doesn’t break in just one place. If money isn’t visible, decisions slip; if process and authority are undefined, leakage follows; if software and data don’t carry the work, efficiency drops; if legal, human and ethical risks stay hidden, trust erodes; if there’s no readiness for disaster, outage or supply risk, work stops. The management layer makes all of it regularly visible. That’s why we organise our services into complementary core areas.": "Бизнес ломается не в одном месте. Если деньги не видны, решения запаздывают; если процессы и полномочия не определены, возникают утечки; если программы и данные не поддерживают работу, падает эффективность; если правовые, человеческие и этические риски скрыты, теряется доверие; без готовности к катастрофам, сбоям и рискам поставок работа останавливается. Управленческий уровень делает всё это регулярно видимым. Поэтому наши услуги разделены на дополняющие друг друга направления.", "Three things that define us": "Три вещи, которые нас определяют", "We’re close": "Мы рядом", "Write on WhatsApp or call. Without long meetings first, we start with whatever you need.": "Напишите в WhatsApp или позвоните. Без долгих предварительных встреч начинаем с того, что вам нужно.", "We keep it simple": "Мы говорим просто", "You don’t need to know service names; start in your own words. We connect that sentence to the right area and the right specialist.": "Знать названия услуг не нужно; начните своими словами. Мы свяжем вашу фразу с нужным направлением и специалистом.", "We’re upfront": "Мы открыты", "We write up front what we do, what we do with authorised partners and what we don’t. We guarantee method, evidence and scope, not outcomes.": "Мы заранее пишем, что делаем, что делаем с лицензированными партнёрами и чего не делаем. Мы гарантируем метод, доказательства и объём, а не результат.", "Our experts": "Наши эксперты", "Here we explain in plain language how the information you leave with us is used.": "Здесь мы простым языком объясняем, как используются оставленные вами данные.", "What information do we collect?": "Какие данные мы собираем?", "The details you enter in the free Quick Check-up form: name, company, phone, optional email, number of employees, sector, selected topics, preferred times and your note. If you write to us on WhatsApp or by email, the content you send and your contact details.": "Данные из формы бесплатного быстрого чек-апа: имя, компания, телефон, e-mail (по желанию), число сотрудников, отрасль, выбранные темы, удобное время и ваша заметка. Если вы пишете нам в WhatsApp или по почте — содержание сообщения и контакты.", "Why do we use it?": "Зачем мы их используем?", "To assess your request, plan the meeting and get in touch with you. We don’t add your details to marketing lists or sell them.": "Чтобы рассмотреть запрос, запланировать встречу и связаться с вами. Мы не вносим ваши данные в маркетинговые списки и не продаём их.", "Who is it shared with?": "С кем ими делятся?", "The Check-up form reaches our team by email through a form-service provider. Where your topic requires, details are shared with authorised partners (e.g. legal, CPA) only with your knowledge and consent. If you write via WhatsApp, WhatsApp’s own terms also apply.": "Форма чек-апа приходит нашей команде по e-mail через сервис форм. Если этого требует ваш вопрос, данные передаются лицензированным партнёрам (напр. юристу, бухгалтеру) только с вашего ведома и согласия. При переписке в WhatsApp действуют и его условия.", "How long is it kept?": "Как долго они хранятся?", "For as long as needed to conclude your request and meet legal obligations; afterwards deleted or anonymised.": "Столько, сколько нужно для решения вашего запроса и выполнения требований закона; затем удаляются или обезличиваются.", "Cookies and browser data": "Cookie и данные браузера", "We use no advertising or tracking cookies. Only your chosen language (TR/EN) is stored in your browser.": "Мы не используем рекламные и отслеживающие cookie. В браузере сохраняются только выбранные язык и валюта.", "Your rights": "Ваши права", "Under Article 11 of Law No. 6698 on the Protection of Personal Data you have rights such as learning whether your data is processed, requesting information, and asking for correction or deletion. You can write to bilgi@orbitkontrol.com.": "Согласно статье 11 Закона № 6698 о защите персональных данных вы вправе узнать, обрабатываются ли ваши данные, запросить информацию, потребовать исправления или удаления. Пишите на bilgi@orbitkontrol.com.", "See where the company’s money is and where it goes.": "Видеть, где деньги компании и куда они уходят.", "Clients usually ask us:": "В этом направлении клиенты обычно спрашивают:", "When will my money come in, and from whom?": "Когда и от кого придут мои деньги?", "Is my collateral worth what I think?": "Стоят ли мои залоги столько, сколько я думаю?", "Are my books and tax process reliable?": "Надёжны ли мой учёт и налоговые процессы?", "Where do I earn, and where do I lose?": "Где я зарабатываю и где теряю?", "Do I need every cost I’ve paid for years?": "Нужны ли все расходы, которые я плачу годами?", "What support can I benefit from?": "Какой поддержкой я могу воспользоваться?", "Open any row to see scope and output. ● Orbit does it · ◐ Orbit + authorised partner · ○ partner does it, Orbit coordinates.": "Раскройте строку, чтобы увидеть объём и результат. ● делает Orbit · ◐ Orbit + лицензированный партнёр · ○ делает партнёр, Orbit координирует.", "Package descriptions are currently in Turkish; message us for English.": "Описания пакетов пока на турецком; напишите нам за подробностями.", "Which service packages include this area?": "В какие пакеты входит это направление?", "Limits and partners": "Границы и партнёры", "Orbit does internal-control reviews; independent audit, certification, filings and books belong to your CPA. Collateral appraisal is done by a licensed valuation body. No credit brokerage or investment advice.": "Orbit проводит аудит внутреннего контроля; аудит, заверение, декларации и учёт остаются у вашего бухгалтера. Оценку залогов выполняет лицензированная оценочная компания. Без кредитного посредничества и инвестиционных советов.", "Hello, I’d like support in the Money area.": "Здравствуйте, мне нужна помощь в направлении «Деньги».", "Make work run independent of individuals, defined and measurable: purchasing, sales, stock, logistics and authority.": "Чтобы работа шла по правилам и измеримо, независимо от людей: закупки, продажи, склад, логистика и полномочия.", "Are my purchases and sales clean?": "Чисты ли мои закупки и продажи?", "Does my stock really exist, at the right value?": "Действительно ли есть мои запасы и по верной ли стоимости?", "Is my shipping efficient?": "Эффективна ли моя доставка?", "Who does what, with what authority?": "Кто что делает и с какими полномочиями?", "Are my recipes, waste and margins right?": "Верны ли мои рецептуры, потери и наценки?", "Orbit does sample testing, phone verification, field and count observation; bookkeeping and tax advice are out of scope. Legal aspects such as signing authority are assessed with the legal partner.": "Orbit проводит выборочные проверки, телефонные подтверждения, наблюдение на объекте и при инвентаризации; учёт и налоговые консультации не входят. Правовые аспекты, напр. право подписи, оцениваются с юридическим партнёром.", "Hello, I’d like support in the Systems area.": "Здравствуйте, мне нужна помощь в направлении «Системы».", "Define software needs and judge whether current software is enough; integrate it if so, build custom software if not. Make data, systems and communications visibly safe. Decision flow: needs definition (B1) → existing-software review (B2) → if it meets the need, integration with ERP and other systems (B6); if not, custom software (B7).": "Определить потребности в ПО и оценить, достаточно ли текущих программ; если да — интегрировать, если нет — разработать своё. Сделать безопасность данных, систем и связи видимой. Порядок: определение потребностей (B1) → аудит текущего ПО (B2) → если подходит, интеграция с ERP и другими системами (B6); если нет — разработка на заказ (B7).", "Does my software meet my needs?": "Отвечает ли ПО моим потребностям?", "Do my systems talk to each other?": "Связаны ли мои системы между собой?", "What if off-the-shelf software doesn’t fit?": "А если готовое ПО не подходит?", "Where are my vehicles and how are they used?": "Где мои машины и как они используются?", "Do my documents and processes flow digitally?": "Идут ли мои документы и процессы в цифре?", "Are my decisions based on data?": "Основаны ли мои решения на данных?", "Are my data and communications safe?": "Защищены ли мои данные и связь?", "Penetration tests are only run with the client’s written consent and a licensed partner; Orbit performs cyber-hygiene scans. Extra development capacity comes from IT partners; source-code and licence terms are written into the contract.": "Пентесты проводятся только с письменного согласия клиента и лицензированным партнёром; Orbit проводит проверку кибергигиены. Дополнительные ресурсы разработки дают ИТ-партнёры; условия по исходному коду и лицензиям прописываются в договоре.", "Hello, I’d like support in the IT area.": "Здравствуйте, мне нужна помощь в направлении «ИТ».", "Make the company’s legal, people, ethics and compliance risks visible.": "Выявить правовые, кадровые, этические риски и риски несоответствия компании.", "What are my contract and structure gaps?": "Какие пробелы в моих договорах и структуре?", "Who and what am I dependent on?": "От кого и от чего я завишу?", "Is there a leak, conflict-of-interest or bribery risk?": "Есть ли риск утечки, конфликта интересов или коррупции?", "Am I ready for regulation and buyer requirements?": "Готов ли я к требованиям регуляторов и покупателей?", "Legal opinions, contract drafting, litigation and enforcement belong to the authorised legal partner; Orbit does contract inventories and risk flagging. The ethics hotline is optional.": "Юридические заключения, договоры, судебные и исполнительные дела — у лицензированного юридического партнёра; Orbit составляет реестр договоров и отмечает риски. Этическая линия — по желанию.", "Hello, I’d like support in the Trust area.": "Здравствуйте, мне нужна помощь в направлении «Доверие».", "Keep the business standing against disaster, outage, supply and insurance risk.": "Помочь бизнесу выстоять перед катастрофами, сбоями, рисками поставок и страхования.", "What if there’s fire, earthquake or flood?": "Что, если будет пожар, землетрясение или наводнение?", "What if production, supply or infrastructure stops?": "Что, если остановятся производство, поставки или инфраструктура?", "Does my insurance really cover my risk?": "Действительно ли страховка покрывает мой риск?", "Official OHS services belong to the licensed provider (F5 is a systems and records check). Insurance advice and policy placement are done with the insurance partner. Orbit provides no protection or emergency-response service.": "Официальные услуги по охране труда — у лицензированной организации (F5 — проверка систем и документации). Страховые консультации и размещение полисов — со страховым партнёром. Orbit не оказывает услуг охраны и экстренного реагирования.", "Hello, I’d like support in the Physical Risks area.": "Здравствуйте, мне нужна помощь в направлении «Физические риски».", "The visibility and discipline layer above the other five.": "Уровень прозрачности и порядка над остальными пятью направлениями.", "Is the system we built still working?": "Работает ли построенная система?", "Am I ready as I grow, hand over or merge?": "Готов ли я к росту, передаче бизнеса или слиянию?", "Is my association run in an orderly, institutional way?": "Работает ли моя ассоциация упорядоченно и институционально?", "Continuous control: subscriptions": "Постоянный контроль: подписки", "A system isn’t finished once built; we keep checking it works. Every subscription month includes at least one random sample test, with results and actions shown in the management report.": "Система не заканчивается на внедрении; мы продолжаем проверять, что она работает. Каждый месяц подписки включает минимум одну случайную выборочную проверку; результаты и действия отражаются в управленческом отчёте.", "The 12 indicators of the management dashboard": "12 показателей управленческой панели", "The nine questions every manager wants answered": "Девять вопросов, на которые хочет ответ каждый руководитель", "How is the company doing right now?": "Как сейчас обстоят дела в компании?", "Where is my money?": "Где мои деньги?", "What am I owed, and what do I owe?": "Сколько мне должны и сколько должен я?", "Which products and customers make money, and where do I lose?": "Какие продукты и клиенты приносят деньги, а где я теряю?", "Which process is stalling?": "Какой процесс буксует?", "Who does what, and which people is the company dependent on?": "Кто что делает и от каких людей зависит компания?", "What are my biggest risks?": "Каковы мои главные риски?", "If a crisis hits, how long can I keep running?": "Сколько я смогу работать в кризис?", "What should I do over the next 3–6–12 months?": "Что мне делать в ближайшие 3–6–12 месяцев?", "The emergency advice line in Corporate Membership is a referral and coordination line, not protection or emergency response. Legal and insurance partners join Orbit Masası when needed.": "Линия экстренных консультаций в корпоративном членстве — это линия направления и координации, а не охрана и не экстренное реагирование. Юридические и страховые партнёры при необходимости присоединяются к Orbit Masası.", "Hello, I’d like support in the Management area.": "Здравствуйте, мне нужна помощь в направлении «Управление».", "Please choose at least one topic and one time slot.": "Выберите хотя бы одну тему и один временной слот.", "Amount": "Сумма", "Hello, I’d like to buy / get information about this Office Task:": "Здравствуйте, хочу купить эту офисную услугу или узнать подробности:", "Quantity": "Количество", "FREE ADVISORY CALL": "БЕСПЛАТНАЯ КОНСУЛЬТАЦИЯ", "Free Quick Check-up": "Бесплатный быстрый чек-ап", "Answer a few short questions and pick the times that suit you. We’ll arrange a free call around your topics.": "Ответьте на несколько коротких вопросов и выберите удобное время. Мы назначим бесплатную беседу по вашим темам.", "1. Which topics would you like to develop or talk about? (pick any)": "1. Какие темы вы хотите обсудить или улучшить? (можно несколько)", "Money & finance": "Деньги и финансы", "Operations, stock & processes": "Операции, склад и процессы", "IT & software": "ИТ и ПО", "Legal, people & ethics": "Право, персонал и этика", "Crisis, disaster & insurance": "Кризис, катастрофы и страхование", "Management & growth": "Управление и рост", "Grants & incentives": "Гранты и льготы", "2. How many employees?": "2. Сколько у вас сотрудников?", "3. Your sector / line of business": "3. Ваша отрасль / вид деятельности", "4. Times that suit you (choose as many as you like)": "4. Удобное время (можно выбрать несколько)", "5. How can we reach you?": "5. Как с вами связаться?", "Send my request": "Отправить заявку", "We’ve received your request. We’ll review the times you chose and get in touch to confirm a suitable slot.": "Ваша заявка получена. Мы рассмотрим выбранное время и свяжемся с вами, чтобы подтвердить встречу.", "Keep control while your company grows.": "Сохраняйте контроль, пока ваша компания растёт.", "Our Areas": "Наши направления", "Reach Us": "Связаться с нами", "Orbit does not provide legal, accounting or independent audit services or insurance brokerage; these are performed by authorised partners. Content on this site is not legal or financial advice.": "Orbit не оказывает юридических, бухгалтерских, аудиторских услуг и не занимается страховым посредничеством; эти работы выполняют лицензированные партнёры. Материалы сайта не являются юридической или финансовой консультацией.", "Cash": "Денежные средства", "Receivables (ageing)": "Дебиторка (по срокам)", "Payables": "Кредиторка", "Profitability": "Рентабельность", "Sales": "Продажи", "Expenses": "Расходы", "Risk": "Риски", "Open actions": "Открытые действия", "Key-person dependency": "Зависимость от ключевых людей", "Outage resilience": "Устойчивость к сбоям", "Collection delay": "Просрочка оплат", "System compliance score": "Оценка соответствия систем", "Foreign-currency amounts use the CBRT forex buying rate ({d}: 1 {c} = {r} TL). Invoicing is in TL.": "Суммы в валюте рассчитаны по курсу покупки ЦБ Турции ({d}: 1 {c} = {r} TL). Счета выставляются в TL.", "Monitor": "Мониторинг", "In the first meeting we listen to your business and find together where the problem starts. Then we prioritise the findings and draw up a simple roadmap showing which step to take, and when.": "На первой встрече мы слушаем вас и вместе находим, где начинается проблема. Затем расставляем приоритеты и составляем простую дорожную карту: какой шаг и когда делать.", "We don’t hand over the system and walk away; we verify at days 30 and 90 that it works and, if you wish, stay beside you with regular checks.": "Мы не уходим, передав систему: на 30-й и 90-й день проверяем, что она работает, и при желании остаёмся рядом с регулярным контролем.", "Six areas, over 100 services, one list.": "Шесть направлений, более 100 услуг, один список.", "Pick only what you need; we combine your choices into one plan and make clear who does what, and when. Not sure where to start? Begin with the free Quick Check-up and we’ll choose the right services together.": "Выберите только нужное; мы объединим выбранное в один план и определим, кто, что и когда делает. Не знаете, с чего начать? Начните с бесплатного быстрого чек-апа — подберём услуги вместе.", "You see prices upfront; pick a quantity and send your request in one click. Our experienced team delivers within the stated time and in confidence.": "Цены видны заранее: выберите количество и отправьте заявку в один клик. Наша опытная команда выполнит работу в указанный срок и конфиденциально.", "Association Administration": "Администрирование ассоциаций", "Scripts & Publishing": "Сценарии и книги", "Are the financial scenes in my script or book realistic?": "Реалистичны ли финансовые сцены в моём сценарии или книге?", "Financial Realism Consulting for Scripts & Books": "Консультация по финансовой достоверности для сценариев и книг", "Realism, consistency and jargon check of financial scenes and dialogue; flagging wrong or unconvincing lines and suggesting accurate alternatives; consistency of figures, dates, titles and processes across the story; a short jargon glossary fitting the character’s profession; optional 1-hour call": "Проверка финансовых сцен и диалогов на достоверность, последовательность и терминологию; отметка неверных или неубедительных фраз с вариантами правильных; согласованность цифр, дат, должностей и процессов по всему сюжету; краткий словарь терминов по профессии персонажа; по желанию — часовая встреча", "page": "страница", "Writers and producers of film, TV, stage scripts or novels who don’t know what to write in scenes involving companies, banks, accounting, tax, stock markets, bankruptcy, inheritance or fraud": "Авторы и продюсеры фильмов, сериалов, пьес или романов, которые не знают, что писать в сценах о компаниях, банках, бухгалтерии, налогах, бирже, банкротстве, наследстве или мошенничестве", "Up to 30 pages: 3 business days; longer texts in steps": "До 30 страниц: 3 рабочих дня; длинные тексты — поэтапно", "The relevant scenes or chapters (Word or PDF), a short synopsis, period and setting, the characters’ professions": "Нужные сцены или главы (Word или PDF), краткий синопсис, время и место действия, профессии персонажей"}, "ar": {"What We Do": "ماذا نفعل", "How We Work": "كيف نعمل", "Services": "الخدمات", "Office Tasks": "المهام المكتبية", "Our Experts": "خبراؤنا", "Contact": "تواصل معنا", "Free Check-up": "فحص مجاني", "BUSINESS CONTROL & SYSTEM DESIGN": "الرقابة على الأعمال وتصميم الأنظمة", "Keep control <em>while your business grows.</em>": "حافظ على السيطرة <em>بينما تنمو أعمالك.</em>", "Where is your money, do your systems understand each other, do you know your risks and are you ready? Together with our specialists we look at it all as one: we see, build and monitor.": "أين أموالك؟ هل تتفاهم أنظمتك مع بعضها؟ هل تعرف مخاطرك وهل أنت مستعد؟ ننظر مع خبرائنا إلى كل ذلك كوحدة واحدة: نرى، ونبني، ونتابع.", "What do we do?": "ماذا نفعل", "OUR AREAS": "مجالاتنا", "Your business’s sustainability depends on all of its systems working together in harmony and working correctly.": "تعتمد استدامة أعمالك على عمل جميع أنظمتها معًا بانسجام وبشكل صحيح.", "A business doesn’t break in just one place. Every step is valuable. If we can’t take hold of money and can’t control it, it can end everything. If process and authority are undefined, leakage follows. If software and data don’t carry the work, efficiency drops. If legal, human and ethical risks stay hidden, trust erodes or damage that is impossible to recover from can occur. If there’s no readiness for disaster, outage or supply risk, work stops. The management layer makes all of it regularly visible.": "لا تنكسر الأعمال من مكان واحد فقط. كل خطوة مهمة. إذا لم نُحكم السيطرة على المال ولم نراقبه، فقد ينهار كل شيء. إذا لم تُحدَّد العمليات والصلاحيات، يحدث التسرب. إذا لم تدعم البرمجيات والبيانات العمل، تنخفض الكفاءة. إذا بقيت المخاطر القانونية والإنسانية والأخلاقية خفية، تتآكل الثقة أو تقع أضرار يستحيل تداركها. وإذا لم يكن هناك استعداد للكوارث والانقطاعات ومخاطر التوريد، يتوقف العمل. وطبقة الإدارة تجعل كل ذلك مرئيًا بانتظام.", "Money": "المال", "Am I on top of my money? Where is it, and where does it go? Am I doing what it takes to keep it from being stolen?": "هل أتحكم في أموالي؟ أين هي وإلى أين تذهب؟ هل أفعل ما يلزم لمنع سرقتها؟", "See the details": "اطّلع على التفاصيل", "Systems": "الأنظمة", "Are my purchasing, sales, stock, logistics and authority definitions under control?": "هل المشتريات والمبيعات والمخزون واللوجستيات والصلاحيات تحت السيطرة؟", "IT": "تقنية المعلومات", "Does my software carry my business? Do my systems talk to each other, and is my data safe?": "هل تحمل برمجياتي أعمالي؟ هل تتواصل أنظمتي مع بعضها وهل بياناتي آمنة؟", "Trust": "الثقة", "Who and what am I dependent on? Are contract, leak, conflict-of-interest and compliance risks visible?": "على من وعلى ماذا أعتمد؟ هل مخاطر العقود والتسرب وتضارب المصالح والامتثال واضحة؟", "Physical Risks": "المخاطر المادية", "If fire, earthquake, flood or an outage hits, does the business stop? Does my insurance really cover the risk?": "هل يتوقف العمل إذا وقع حريق أو زلزال أو فيضان أو انقطاع؟ هل يغطي التأمين المخاطر فعلًا؟", "Management": "الإدارة", "Where does my company stand today? Is the system we built still working? Am I ready to grow, hand over or merge?": "أين تقف شركتي اليوم؟ هل ما زال النظام الذي بنيناه يعمل؟ هل أنا مستعد للنمو أو التسليم أو الاندماج؟", "OUR METHOD": "منهجيتنا", "From assessment to verification.": "من التشخيص إلى التحقق.", "We work with one four-step method: we see the situation, advise, build the system and verify that it works.": "نعمل بمنهجية واحدة من أربع خطوات: نرى الوضع، ونقدّم المشورة، ونبني النظام، ونتحقق من أنه يعمل.", "How we work": "كيف نعمل", "Assess": "التشخيص", "Where does my company stand today?": "أين تقف شركتي اليوم؟", "We understand the current situation through data, documents, interviews, processes and sys usinesses that receive enforcement-office letters about an employee (salary garnishment, garnishment notices) and want to reply correctly and on time": "المنشآت التي تتلقى كتبًا من دائرة التنفيذ بشأن موظف (حجز على الراتب، إشعار حجز) وتريد الرد بشكل صحيح وفي الوقت المحدد", "1 business day after the letter and details arrive; please send the letter the day you receive it so the deadline stated in it isn’t missed": "يوم عمل واحد بعد وصول الكتاب والبيانات؛ يُرجى إرسال الكتاب في يوم استلامه حتى لا تفوت المهلة المذكورة فيه", "Copy of the enforcement letter, employee’s status (still employed or left), salary and current deductions, authorised signatory’s details, mailing address": "نسخة من كتاب التنفيذ، وضع الموظف (ما زال يعمل أم غادر)، الراتب والاستقطاعات الحالية، بيانات المفوّض بالتوقيع، العنوان البريدي", "Businesses that want to hire a foreign national or renew a permit": "المنشآت التي تريد توظيف أجنبي أو تجديد تصريحه", "Application preparation in 2–3 business days with complete documents; the decision time depends on the authority": "إعداد الطلب في 2–3 أيام عمل مع اكتمال المستندات؛ وتعتمد مدة القرار على الجهة الرسمية", "Company details, the employee’s passport and diploma/profession details, draft employment contract, your signatory’s e-signature, previous permit if any": "بيانات الشركة، جواز سفر الموظف وبيانات شهادته/مهنته، مسودة عقد العمل، التوقيع الإلكتروني للمفوّض، التصريح السابق إن وجد", "Founders who want to set up an association correctly and completely from day one": "المؤسسون الذين يريدون تأسيس جمعية بشكل صحيح وكامل منذ اليوم الأول", "5 business days once founder details are complete": "5 أيام عمل بعد اكتمال بيانات المؤسسين", "The association’s purpose and field, founding members’ details, head-office address, any sample statutes you like": "هدف الجمعية ومجال نشاطها، بيانات الأعضاء المؤسسين، عنوان المقر، نماذج أنظمة أساسية تعجبك إن وجدت", "Associations that are set up but whose administration hasn’t settled and depends on individuals": "الجمعيات القائمة التي ل unts, purchasing and sales reviews; collateral, FX and budgets; signature circulars and authority matrices; merger processes and report review.": "محاسب قانوني معتمد (SMMM). يعمل في الرقابة المالية والرقابة الداخلية واندماج الشركات. يراجع ميزان المراجعة والحسابات والمشتريات والمبيعات؛ والضمانات والعملات والميزانيات؛ وسجلات التواقيع ومصفوفات الصلاحيات؛ وعمليات الاندماج ومراجعة التقارير.", "Nuri Üngel": "Nuri Üngel", "Business Continuity · Physical Risk": "استمرارية الأعمال · المخاطر المادية", "Fire engineer. Covers disasters, evacuation, drills, business continuity plans and emergency training.": "مهندس حماية من الحرائق. يختص بالكوارث والإخلاء والتمارين وخطط استمرارية الأعمال والتدريب على الطوارئ.", "Emrah Genç": "Emrah Genç", "Software · ERP · Integration": "البرمجيات · ERP · التكامل", "Holds a business degree and a master’s in Computer Engineering. Runs software needs definition, existing-software reviews, ERP, integration, custom software and vehicle-tracking projects.": "حاصل على شهادة في إدارة الأعمال وماجستير في هندسة الحاسوب. يدير مشاريع تحديد احتياجات البرمجيات، ومراجعة البرمجيات الحالية، وERP، والتكامل، والبرمجيات المخصصة، وتتبع المركبات.", "Sinan Yelkenci": "Sinan Yelkenci", "Master’s from METU; specialist in cybercrime and IT crime. Runs cyber-hygiene scans, backup-restore tests, phishing simulations, technical-protection coordination, digital ownership and access management.": "ماجستير من جامعة الشرق الأوسط التقنية (METU)؛ مختص في الجرائم السيبرانية والمعلوماتية. يدير فحوص النظافة السيبرانية، واختبارات الاستعادة، ومحاكاة التصيد، وتنسيق الحماية التقنية، والملكية الرقمية وإدارة الوصول.", "Partners whose professional advice we draw on where their expertise is needed. They carry out regulated or licensed work under their own contracts and responsibility.": "شركاء نستعين بخبرتهم المهنية حيث تلزم. يتولون الأعمال المنظمة أو المرخصة بعقودهم ومسؤوليتهم الخاصة.", "Legal opinions, contract and text drafting, KVKK texts, post-incident legal process; trademark and patent attorneys for IP.": "الآراء القانونية، وصياغة العقود والنصوص، ونصوص KVKK، والإجراءات القانونية بعد الحوادث؛ ووكلاء العلامات والبراءات للملكية الفكرية.", "Tax advice, filings, books, certification, transfer pricing, incentive-document approval.": "الاستشارات الضريبية، والإقرارات، والدفاتر، والتصديق، وتسعير التحويل، واعتماد مستندات الحوافز.", "Insurance Agent / Broker": "وكيل / وسيط تأمين", "Coverage advice, quote gathering, policy placement, claims process.": "استشارات التغطية، وجمع العروض، وإصدار الوثائق، ومتابعة المطالبات.", "OHS Provider": "مزوّد السلامة المهنية", "Official OHS service, signed risk assessment, workplace physician, training.": "خدمة السلامة المهنية الرسمية، وتقييم المخاطر الموقّع، وطبيب العمل، والتدريبات.", "Quality Systems & QESH": "أنظمة الجودة والصحة والسلامة والبيئة", "OHS system checks, ISO certification readiness, environment and carbon data, procedure documentation.": "فحص أنظمة السلامة المهنية، والتحضير لشهادات ISO، وبيانات البيئة والكربون، وتوثيق الإجراءات.", "IT Partner": "شريك تقنية المعلومات", "Extra capacity for development, integration and infrastructure.": "قدرات إضافية للتطوير والتكامل والبنية التحتية.", "Data architecture and governance, BI and analytics, process redesign, IT strategy and team design, data-protection officer (DPO) support.": "هندسة البيانات وحوكمتها، وذكاء الأعمال والتحليلات، وإعادة تصميم العمليات، واستراتيجية تقنية المعلومات وتصميم الفريق، ودعم مسؤول حماية البيانات (DPO).", "Licensed Cybersecurity": "أمن سيبراني مرخّص", "Vulnerability scans, penetration tests, technical execution of restore tests.": "فحص الثغرات، واختبارات الاختراق، والتنفيذ التقني لاختبارات الاستعادة.", "Technical Protection (licensed)": "الحماية التقنية (مرخّصة)", "Eavesdropping, tracking-device and malware sweeps.": "فحص أجهزة التنصت والتتبع والبرمجيات الخبيثة.", "Grants & Support": "المنح والدعم", "Screening grant, support and incentive programmes, preparing the application file and following the process.": "مسح برامج المنح والدعم والحوافز، وإعداد ملف الطلب، ومتابعة الإجراءات.", "Corporate Identity Design": "تصميم الهوية المؤسسية", "Logo, colour and type system, letterhead, business cards, presentation and document templates; brand guidelines.": "الشعار، ونظام الألوان والخطوط، والأوراق الرسمية، وبطاقات العمل، وقوالب العروض والمستندات؛ دليل الهوية.", "Property & Land Collateral Appraisal": "تقييم ضمانات العقارات والأراضي", "Appraisal of property and land collateral by licensed valuers; current value report.": "تقييم ضمانات العقارات والأراضي من قِبل مقيّمين مرخّصين؛ تقرير بالقيمة الحالية.", "Food: Recipe, Waste & Cost": "الأغذية: الوصفات والهدر والتكلفة", "Food recipe, waste and profitability control; standardisation for food businesses heading toward chains.": "رقابة الوصفات والهدر والربحية؛ وتوحيد المعايير لمنشآت الأغذية المتجهة إلى السلاسل.", "Accredited & Licensed Bodies": "الجهات المعتمدة والمرخّصة", "Emissions verification, ISO certification, measurement, official energy audits.": "التحقق من الانبعاثات، وشهادات ISO، والقياسات، وتدقيق الطاقة الرسمي.", "Other": "أخرى", "Project-based work on varied topics such as engineering-heavy special subjects and Human Resources.": "عمل قائم على المشاريع في موضوعات متنوعة مثل المسائل الهندسية الخاصة والموارد البشرية.", "Our working principles": "مبادئ عملنا", "Every project has one lead (project manager) and one second reviewer.": "لكل مشروع مسؤول (مدير مشروع) ومراجع ثانٍ.", "On topics that need specialist knowledge, a team works under the specialist’s supervision.": "في الموضوعات التي تتطلب معرفة متخصصة، يعمل فريق تحت إشراف المختص.", "Each expert works in their own field: a software lead on software jobs, a cybersecurity lead on cybersecurity jobs.": "يعمل كل خبير في مجاله: مسؤول البرمجيات في مشاريع البرمجيات، ومسؤول الأمن السيبراني في مشاريع الأمن السيبراني.", "Partners declare any conflict of interest; experts give no opinions outside their remit and refer to a partner.": "يُفصح الشركاء عن أي تضارب في المصالح؛ ولا يُبدي الخبراء رأيًا خارج اختصاصهم بل يحيلون إلى شريك.", "Reach us quickly on WhatsApp, Telegram or WeChat.": "تواصل معنا بسرعة عبر واتساب أو تيليغرام أو وي تشات.", "On WeChat you can find us with the number 0 532 598 97 04.": "يمكنك إيجادنا على وي تشات بالرقم 0 532 598 97 04.", "Email": "البريد الإلكتروني", "Address": "العنوان", "Hello, I’d like some information.": "مرحبًا، أود الحصول على معلومات.", "Not cold reports, but solutions that touch your work right away. We’re an approachable team that stands beside growing businesses so they keep control as they grow.": "ليست تقارير جافة، بل حلول تلامس عملك فورًا. نحن فريق قريب يقف إلى جانب الشركات النامية لتحافظ على السيطرة أثناء نموها.", "Who are we?": "من نحن؟", "Orbit Kontrol is a team that treats the money, operations, IT, trust and physical risks of growing SMEs and family companies as one business system: it designs the system, sets it up and monitors that it works. System design sits at the centre, with specialists from different disciplines around it.": "Orbit Kontrol فريق يتعامل مع المال والعمليات وتقنية المعلومات والثقة والمخاطر المادية للشركات الصغيرة والمتوسطة النامية والشركات العائلية كنظام عمل واحد: يصمم النظام ويطبقه ويتابع عمله. في المركز تصميم الأنظمة، وحوله خبراء من تخصصات مختلفة.", "Our starting point: sustainability": "نقطة انطلاقنا: الاستدامة", "A business doesn’t break in just one place. If money isn’t visible, decisions slip; if process and authority are undefined, leakage follows; if software and data don’t carry the work, efficiency drops; if legal, human and ethical risks stay hidden, trust erodes; if there’s no readiness for disaster, outage or supply risk, work stops. The management layer makes all of it regularly visible. That’s why we organise our services into complementary core areas.": "لا تنكسر الأعمال من مكان واحد فقط. إذا لم يكن المال مرئيًا تتأخر القرارات؛ وإذا لم تُحدد العمليات والصلاحيات يحدث التسرب؛ وإذا لم تدعم البرمجيات والبيانات العمل تنخفض الكفاءة؛ وإذا بقيت المخاطر القانونية والإنسانية والأخلاقية خفية تتآكل الثقة؛ وإذا لم يكن هناك استعداد للكوارث والانقطاع ومخاطر التوريد يتوقف العمل. وطبقة الإدارة تجعل كل ذلك مرئيًا بانتظام. لذلك قسّمنا خدماتنا إلى مجالات رئيسية متكاملة.", "Three things that define us": "ثلاثة أمور تميّزنا", "We’re close": "نحن قريبون", "Write on WhatsApp or call. Without long meetings first, we start with whatever you need.": "راسلنا على واتساب أو اتصل بنا. نبدأ بما تحتاجه دون اجتماعات طويلة مسبقة.", "We keep it simple": "نحن بسطاء", "You don’t need to know service names; start in your own words. We connect that sentence to the right area and the right specialist.": "لا تحتاج إلى معرفة أسماء الخدمات؛ ابدأ بكلماتك. وسنربط جملتك بالمجال الصحيح والخبير المناسب.", "We’re upfront": "نحن واضحون", "We write up front what we do, what we do with authorised partners and what we don’t. We guarantee method, evidence and scope, not outcomes.": "نكتب مسبقًا ما نفعله، وما نفعله مع شركاء مرخّصين، وما لا نفعله. نضمن المنهجية والدليل والنطاق، لا النتيجة.", "Our experts": "خبراؤنا", "Here we explain in plain language how the information you leave with us is used.": "نوضّح هنا بلغة بسيطة كيف تُستخدم المعلومات التي تتركها لدينا.", "What information do we collect?": "ما المعلومات التي نجمعها؟", "The details you enter in the free Quick Check-up form: name, company, phone, optional email, number of employees, sector, selected topics, preferred times and your note. If you write to us on WhatsApp or by email, the content you send and your contact details.": "البيانات التي تُدخلها في نموذج الفحص السريع المجاني: الاسم، الشركة، الهاتف، البريد الإلكتروني اختياريًا، عدد الموظفين، القطاع، الموضوعات المختارة، الأوقات المفضلة وملاحظتك. وإذا راسلتنا عبر واتساب أو البريد، فمحتوى رسالتك وبيانات الاتصال.", "Why do we use it?": "لماذا نستخدمها؟", "To assess your request, plan the meeting and get in touch with you. We don’t add your details to marketing lists or sell them.": "لتقييم طلبك وتحديد موعد الاجتماع والتواصل معك. لا نضيف بياناتك إلى قوائم تسويقية ولا نبيعها.", "Who is it shared with?": "مع من تتم مشاركتها؟", "The Check-up form reaches our team by email through a form-service provider. Where your topic requires, details are shared with authorised partners (e.g. legal, CPA) only with your knowledge and consent. If you write via WhatsApp, WhatsApp’s own terms also apply.": "يصل نموذج الفحص إلى فريقنا بالبريد الإلكتروني عبر مزوّد خدمة نماذج. وعند حاجة موضوعك، تُشارك البيانات مع شركاء مرخّصين (مثل المحامي أو المحاسب) بعلمك وموافقتك فقط. وإذا راسلتنا عبر واتساب تسري شروطه أيضًا.", "How long is it kept?": "كم تُحفظ؟", "For as long as needed to conclude your request and meet legal obligations; afterwards deleted or anonymised.": "طالما كان ذلك لازمًا لإنهاء طلبك والوفاء بالالتزامات القانونية؛ ثم تُحذف أو تُجعل مجهولة الهوية.", "Cookies and browser data": "ملفات تعريف الارتباط وبيانات المتصفح", "We use no advertising or tracking cookies. Only your chosen language (TR/EN) is stored in your browser.": "لا نستخدم ملفات تعريف ارتباط إعلانية أو تتبعية. تُحفظ في متصفحك فقط اللغة والعملة اللتان اخترتهما.", "Your rights": "حقوقك", "Under Article 11 of Law No. 6698 on the Protection of Personal Data you have rights such as learning whether your data is processed, requesting information, and asking for correction or deletion. You can write to bilgi@orbitkontrol.com.": "بموجب المادة 11 من القانون رقم 6698 لحماية البيانات الشخصية، لديك حقوق منها معرفة ما إذا كانت بياناتك تُعالَج، وطلب المعلومات، وطلب التصحيح أو الحذف. يمكنك مراسلتنا على bilgi@orbitkontrol.com.", "See where the company’s money is and where it goes.": "رؤية أين أموال الشركة وإلى أين تذهب.", "Clients usually ask us:": "يسألنا العملاء في هذا المجال عادةً:", "When will my money come in, and from whom?": "متى ستصل أموالي ومن أين؟", "Is my collateral worth what I think?": "هل تساوي ضماناتي القيمة التي أظنها؟", "Are my books and tax process reliable?": "هل دفاتري وعمليتي الضريبية موثوقة؟", "Where do I earn, and where do I lose?": "أين أكسب وأين أخسر؟", "Do I need every cost I’ve paid for years?": "هل أحتاج كل التكاليف التي أدفعها منذ سنوات؟", "What support can I benefit from?": "ما الدعم الذي يمكنني الاستفادة منه؟", "Open any row to see scope and output. ● Orbit does it · ◐ Orbit + authorised partner · ○ partner does it, Orbit coordinates.": "افتح أي سطر لرؤية النطاق والمخرجات. ● تنفذه Orbit · ◐ Orbit + شريك مرخّص · ○ ينفذه الشريك وتنسقه Orbit.", "Package descriptions are currently in Turkish; message us for English.": "أوصاف الباقات حاليًا باللغة التركية؛ راسلنا للتفاصيل.", "Which service packages include this area?": "ما باقات الخدمات التي تشمل هذا المجال؟", "Limits and partners": "الحدود والشركاء", "Orbit does internal-control reviews; independent audit, certification, filings and books belong to your CPA. Collateral appraisal is done by a licensed valuation body. No credit brokerage or investment advice.": "تجري Orbit مراجعات الرقابة الداخلية؛ أما التدقيق المستقل والتصديق والإقرارات والدفاتر فهي لدى محاسبك. ويُجري تقييم الضمانات جهة تقييم مرخّصة. لا وساطة ائتمانية ولا استشارات استثمارية.", "Hello, I’d like support in the Money area.": "مرحبًا، أود الحصول على دعم في مجال المال.", "Make work run independent of individuals, defined and measurable: purchasing, sales, stock, logistics and authority.": "جعل العمل مستقلًا عن الأشخاص، محددًا وقابلًا للقياس: المشتريات والمبيعات والمخزون واللوجستيات والصلاحيات.", "Are my purchases and sales clean?": "هل مشترياتي ومبيعاتي سليمة؟", "Does my stock really exist, at the right value?": "هل مخزوني موجود فعلًا وبالقيمة الصحيحة؟", "Is my shipping efficient?": "هل شحناتي فعّالة؟", "Who does what, with what authority?": "من يفعل ماذا وبأي صلاحية؟", "Are my recipes, waste and margins right?": "هل وصفاتي وهدري وهوامشي صحيحة؟", "Orbit does sample testing, phone verification, field and count observation; bookkeeping and tax advice are out of scope. Legal aspects such as signing authority are assessed with the legal partner.": "تجري Orbit اختبارات العينات والتأكيد الهاتفي والملاحظة الميدانية وأثناء الجرد؛ ولا تشمل مسك الدفاتر أو الاستشارات الضريبية. وتُقيّم الجوانب القانونية مثل صلاحيات التوقيع مع الشريك القانوني.", "Hello, I’d like support in the Systems area.": "مرحبًا، أود الحصول على دعم في مجال الأنظمة.", "Define software needs and judge whether current software is enough; integrate it if so, build custom software if not. Make data, systems and communications visibly safe. Decision flow: needs definition (B1) → existing-software review (B2) → if it meets the need, integration with ERP and other systems (B6); if not, custom software (B7).": "تحديد احتياجات البرمجيات والحكم على كفاية البرمجيات الحالية؛ ودمجها إن كانت كافية، أو تطوير برمجيات مخصصة إن لم تكن. وجعل أمان البيانات والأنظمة والاتصالات مرئيًا. مسار القرار: تحديد الاحتياجات (B1) ← مراجعة البرمجيات الحالية (B2) ← إن لبّت الحاجة، التكامل مع ERP والأنظمة الأخرى (B6)؛ وإلا، برمجيات مخصصة (B7).", "Does my software meet my needs?": "هل تلبي برمجياتي احتياجاتي؟", "Do my systems talk to each other?": "هل تتواصل أنظمتي مع بعضها؟", "What if off-the-shelf software doesn’t fit?": "ماذا لو لم تناسبني البرمجيات الجاهزة؟", "Where are my vehicles and how are they used?": "أين مركباتي وكيف تُستخدم؟", "Do my documents and processes flow digitally?": "هل تتدفق مستنداتي وعملياتي رقميًا؟", "Are my decisions based on data?": "هل تستند قراراتي إلى البيانات؟", "Are my data and communications safe?": "هل بياناتي واتصالاتي آمنة؟", "Penetration tests are only run with the client’s written consent and a licensed partner; Orbit performs cyber-hygiene scans. Extra development capacity comes from IT partners; source-code and licence terms are written into the contract.": "لا تُجرى اختبارات الاختراق إلا بموافقة خطية من العميل ومع شريك مرخّص؛ وتجري Orbit فحوص النظافة السيبرانية. وتأتي القدرات الإضافية للتطوير من شركاء تقنية المعلومات؛ وتُكتب شروط الشيفرة المصدرية والتراخيص في العقد.", "Hello, I’d like support in the IT area.": "مرحبًا، أود الحصول على دعم في مجال تقنية المعلومات.", "Make the company’s legal, people, ethics and compliance risks visible.": "جعل المخاطر القانونية والبشرية والأخلاقية ومخاطر الامتثال للشركة مرئية.", "What are my contract and structure gaps?": "ما ثغرات عقودي وهيكلي؟", "Who and what am I dependent on?": "على من وعلى ماذا أعتمد؟", "Is there a leak, conflict-of-interest or bribery risk?": "هل هناك خطر تسرب أو تضارب مصالح أو رشوة؟", "Am I ready for regulation and buyer requirements?": "هل أنا مستعد للتنظيمات ومتطلبات المشترين؟", "Legal opinions, contract drafting, litigation and enforcement belong to the authorised legal partner; Orbit does contract inventories and risk flagging. The ethics hotline is optional.": "الآراء القانونية وصياغة العقود والتقاضي والتنفيذ من اختصاص الشريك القانوني المرخّص؛ وتُعدّ Orbit جرد العقود وتميّز المخاطر. خط البلاغات الأخلاقية اختياري.", "Hello, I’d like support in the Trust area.": "مرحبًا، أود الحصول على دعم في مجال الثقة.", "Keep the business standing against disaster, outage, supply and insurance risk.": "الحفاظ على صمود العمل أمام مخاطر الكوارث والانقطاع والتوريد والتأمين.", "What if there’s fire, earthquake or flood?": "ماذا لو وقع حريق أو زلزال أو فيضان؟", "What if production, supply or infrastructure stops?": "ماذا لو توقف الإنتاج أو التوريد أو البنية التحتية؟", "Does my insurance really cover my risk?": "هل يغطي تأميني مخاطري فعلًا؟", "Official OHS services belong to the licensed provider (F5 is a systems and records check). Insurance advice and policy placement are done with the insurance partner. Orbit provides no protection or emergency-response service.": "خدمات السلامة المهنية الرسمية من اختصاص المزوّد المرخّص (F5 فحص للأنظمة والسجلات). وتتم استشارات التأمين وإصدار الوثائق مع شريك التأمين. لا تقدم Orbit خدمات حماية أو استجابة طارئة.", "Hello, I’d like support in the Physical Risks area.": "مرحبًا، أود الحصول على دعم في مجال المخاطر المادية.", "The visibility and discipline layer above the other five.": "طبقة الوضوح والانضباط فوق المجالات الخمسة الأخرى.", "Is the system we built still working?": "هل ما زال النظام الذي بنيناه يعمل؟", "Am I ready as I grow, hand over or merge?": "هل أنا مستعد للنمو أو التسليم أو الاندماج؟", "Is my association run in an orderly, institutional way?": "هل تُدار جمعيتي بشكل منظم ومؤسسي؟", "Continuous control: subscriptions": "الرقابة المستمرة: الاشتراكات", "A system isn’t finished once built; we keep checking it works. Every subscription month includes at least one random sample test, with results and actions shown in the management report.": "لا ينتهي النظام بإنشائه؛ نواصل التحقق من أنه يعمل. يتضمن كل شهر اشتراك اختبار عينة عشوائيًا واحدًا على الأقل، وتظهر النتائج والإجراءات في التقرير الإداري.", "The 12 indicators of the management dashboard": "المؤشرات الـ 12 للوحة الإدارة", "The nine questions every manager wants answered": "الأسئلة التسعة التي يريد كل مدير إجابتها", "How is the company doing right now?": "كيف حال الشركة الآن؟", "Where is my money?": "أين أموالي؟", "What am I owed, and what do I owe?": "كم لي وكم عليّ؟", "Which products and customers make money, and where do I lose?": "أي المنتجات والعملاء يحققون الربح، وأين أخسر؟", "Which process is stalling?": "أي عملية متعثرة؟", "Who does what, and which people is the company dependent on?": "من يفعل ماذا، وعلى أي أشخاص تعتمد الشركة؟", "What are my biggest risks?": "ما أكبر مخاطري؟", "If a crisis hits, how long can I keep running?": "إذا وقعت أزمة، كم يمكنني الاستمرار في العمل؟", "What should I do over the next 3–6–12 months?": "ماذا يجب أن أفعل خلال 3–6–12 شهرًا القادمة؟", "The emergency advice line in Corporate Membership is a referral and coordination line, not protection or emergency response. Legal and insurance partners join Orbit Masası when needed.": "خط استشارات الطوارئ في العضوية المؤسسية خط توجيه وتنسيق، وليس حماية أو استجابة طارئة. ينضم الشركاء القانونيون وشركاء التأمين إلى Orbit Masası عند الحاجة.", "Hello, I’d like support in the Management area.": "مرحبًا، أود الحصول على دعم في مجال الإدارة.", "Please choose at least one topic and one time slot.": "يرجى اختيار موضوع واحد وفترة زمنية واحدة على الأقل.", "Amount": "المبلغ", "Hello, I’d like to buy / get information about this Office Task:": "مرحبًا، أود شراء هذه الخدمة المكتبية أو الاستفسار عنها:", "Quantity": "الكمية", "FREE ADVISORY CALL": "استشارة مجانية", "Free Quick Check-up": "الفحص السريع المجاني", "Answer a few short questions and pick the times that suit you. We’ll arrange a free call around your topics.": "أجب عن بضعة أسئلة قصيرة واختر الأوقات المناسبة لك. سنرتّب محادثة مجانية حول موضوعاتك.", "1. Which topics would you like to develop or talk about? (pick any)": "1. ما الموضوعات التي تود تطويرها أو مناقشتها؟ (يمكن اختيار أكثر من واحد)", "Money & finance": "المال والتمويل", "Operations, stock & processes": "العمليات والمخزون والإجراءات", "IT & software": "تقنية المعلومات والبرمجيات", "Legal, people & ethics": "القانون والموظفون والأخلاقيات", "Crisis, disaster & insurance": "الأزمات والكوارث والتأمين", "Management & growth": "الإدارة والنمو", "Grants & incentives": "المنح والحوافز", "2. How many employees?": "2. كم عدد موظفيك؟", "3. Your sector / line of business": "3. قطاعك / مجال نشاطك", "4. Times that suit you (choose as many as you like)": "4. الأوقات المناسبة لك (اختر ما تشاء)", "5. How can we reach you?": "5. كيف نتواصل معك؟", "Send my request": "أرسل طلبي", "We’ve received your request. We’ll review the times you chose and get in touch to confirm a suitable slot.": "وصلنا طلبك. سنراجع الأوقات التي اخترتها ونتواصل معك لتأكيد الموعد المناسب.", "Keep control while your company grows.": "حافظ على السيطرة بينما تنمو شركتك.", "Our Areas": "مجالاتنا", "Reach Us": "تواصل معنا", "Orbit does not provide legal, accounting or independent audit services or insurance brokerage; these are performed by authorised partners. Content on this site is not legal or financial advice.": "لا تقدّم Orbit خدمات المحاماة أو المحاسبة أو التدقيق المستقل أو الوساطة التأمينية؛ إذ ينفّذها شركاء مرخّصون. ولا يُعدّ محتوى هذا الموقع استشارة قانونية أو مالية.", "Cash": "النقد", "Receivables (ageing)": "الذمم المدينة (حسب العمر)", "Payables": "الذمم الدائنة", "Profitabili
